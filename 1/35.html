<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>韵律花园 · 绽放节拍</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #1a1c2b, #0b0d17);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Cormorant Garamond', 'Times New Roman', serif;
      padding: 20px;
      margin: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .game-container {
      background: rgba(255, 245, 240, 0.08);
      backdrop-filter: blur(18px);
      border-radius: 4rem 4rem 3rem 3rem;
      padding: 25px 35px 35px;
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(210, 180, 140, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      border-radius: 3rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(230, 200, 160, 0.3);
      background: radial-gradient(ellipse at center, #1e1f2c 0%, #0a0c14 100%);
      transition: filter 0.2s ease;
      cursor: pointer;
    }

    .info-panel {
      width: 100%;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e8d5c4;
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
      background: rgba(20, 18, 24, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 100px;
      padding: 12px 28px;
      border: 1px solid rgba(255, 220, 180, 0.35);
      font-size: 1.2rem;
      flex-wrap: wrap;
      gap: 15px;
    }

    .score-box, .combo-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .label {
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #b7a48b;
      font-weight: 300;
    }

    .value {
      font-size: 2.2rem;
      font-weight: 500;
      color: #fae3c6;
      line-height: 1;
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    }

    .combo .value {
      color: #f7d194;
      text-shadow: 0 0 18px #ffb45e;
    }

    .bpm-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bpm-light {
      width: 18px;
      height: 18px;
      background: #fbe4b0;
      border-radius: 50%;
      box-shadow: 0 0 20px #ffc857;
      animation: pulse-bpm 0.4s infinite alternate ease-in-out;
    }

    @keyframes pulse-bpm {
      0% { opacity: 0.7; transform: scale(0.9); background: #fdd892; box-shadow: 0 0 15px #fcb045; }
      100% { opacity: 1; transform: scale(1.3); background: #fff2cf; box-shadow: 0 0 35px #ffaa33; }
    }

    .bpm-text {
      font-weight: 400;
      color: #ecd5b0;
      font-size: 1.3rem;
    }

    .hint {
      color: #b7a797;
      font-style: italic;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    @media (max-width: 550px) {
      .info-panel {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .value {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center;">
  <div class="game-container">
    <canvas id="rhythmCanvas" width="650" height="480" aria-label="韵律花园游戏画布，点击音符让花朵绽放"></canvas>
    <div class="info-panel">
      <div class="score-box">
        <span class="label">绽放</span>
        <span class="value" id="scoreDisplay">0</span>
      </div>
      <div class="combo-box">
        <span class="label">连击</span>
        <span class="value" id="comboDisplay">0</span>
      </div>
      <div class="bpm-indicator">
        <div class="bpm-light"></div>
        <span class="bpm-text">150 BPM</span>
      </div>
      <div class="hint">轻触音符·静待花开</div>
    </div>
  </div>
  <div style="color:#aa9b8c; margin-top: 15px; font-size: 0.9rem; letter-spacing: 2px;">
    ✦ 节奏硬核 · 花园愈心 ✦
  </div>
</div>

<script>
  (function() {
    // ---------- 高雅韵律花园：核心参数 ----------
    const canvas = document.getElementById('rhythmCanvas');
    const ctx = canvas.getContext('2d');

    // 显示元素
    const scoreSpan = document.getElementById('scoreDisplay');
    const comboSpan = document.getElementById('comboDisplay');

    // 尺寸设定
    const W = 650, H = 480;

    // 节拍引擎 (150 BPM 硬核底鼓)
    const BPM = 150;
    const beatInterval = 60000 / BPM; // 每拍毫秒数 (400ms)
    // 为了让节奏更密集但保留强拍，我们使用八分音符间隔 (200ms) 作为音符生成基础，但强拍(底鼓)落在每个四分音符上。
    const noteInterval = beatInterval / 2; // 200ms 八分音符，产生连续律动
    // 但保留明显底鼓感：每两个音符(400ms) 会伴随视觉强调

    // 游戏状态
    let score = 0;
    let combo = 0;
    let maxCombo = 0;

    // 活跃音符数组
    let notes = [];

    // 粒子系统 (花瓣、光点)
    let particles = [];

    // 花园绽放背景元素 (固定装饰)
    let gardenDecorations = [];

    // 时间控制
    let lastNoteTime = 0;
    let animationFrameId = null;
    let gameLoopRunning = true;

    // 节拍计数器 (用于强拍检测)
    let beatCounter = 0; // 每生成一个音符递增，用于判断强拍

    // 鼠标/触摸交互
    let pointerX = 0, pointerY = 0;
    let pointerActive = false;

    // ---------- 音符类 (节奏种子) ----------
    class Note {
      constructor(x, y, timestamp, isStrongBeat = false) {
        this.x = x;                // 固定位置
        this.y = y;
        this.baseRadius = 22;      // 基础半径
        this.radius = this.baseRadius;
        this.timestamp = timestamp; // 创建时间戳 (performance.now)
        this.clicked = false;
        this.missed = false;
        this.isStrong = isStrongBeat; // 强拍底鼓音符
        // 视觉属性
        this.opacity = 1.0;
        this.pulsePhase = Math.random() * Math.PI * 2;
        // 音符内部花纹
        this.innerPetals = 5 + Math.floor(Math.random() * 4);
      }

      // 检查是否过期 (超过时间窗口未点击)
      isExpired(now) {
        const elapsed = now - this.timestamp;
        // 给予玩家反应时间：约 beatInterval * 1.2 (大约480ms) 后消失并算作miss
        return elapsed > beatInterval * 1.25;
      }

      // 获取当前半径 (随时间略微变化)
      getCurrentRadius(now) {
        const age = now - this.timestamp;
        const maxAge = beatInterval * 1.25;
        // 靠近消失时微微缩小
        if (age > beatInterval * 0.9) {
          return this.baseRadius * 0.85;
        }
        return this.baseRadius;
      }
    }

    // ---------- 粒子类 (花瓣/光点) ----------
    class Particle {
      constructor(x, y, type = 'petal', comboLevel = 1) {
        this.x = x;
        this.y = y;
        this.type = type; // 'petal', 'spark', 'glow'
        this.life = 1.0;
        this.maxLife = 0.8 + Math.random() * 0.9;
        this.decay = 0.008 + Math.random() * 0.02;
        // 运动轨迹
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 3.5 + comboLevel * 0.3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 0.7; // 轻微上升
        this.size = 2.5 + Math.random() * 7;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.25;
        // 颜色根据类型变化
        if (type === 'petal') {
          this.hue = 280 + Math.random() * 60; // 紫罗兰/粉
          if (Math.random() > 0.6) this.hue = 20 + Math.random() * 30; // 暖金
        } else if (type === 'spark') {
          this.hue = 45 + Math.random() * 30; // 金色光点
        } else {
          this.hue = 200 + Math.random() * 40; // 淡蓝辉光
        }
        this.saturation = 60 + Math.random() * 40;
        this.lightness = 70 + Math.random() * 25;
        this.alpha = 0.9;
      }

      update() {
        this.life -= this.decay;
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.04; // 微重力
        this.rotation += this.rotationSpeed;
        this.alpha = Math.min(this.life * 1.2, 0.95);
      }

      isDead() {
        return this.life <= 0.02;
      }
    }

    // ---------- 初始化花园装饰 (静态背景艺术) ----------
    function initGardenDecor() {
      gardenDecorations = [];
      // 散布藤蔓曲线点、光晕等
      for (let i = 0; i < 18; i++) {
        gardenDecorations.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.8 + 20,
          radius: 15 + Math.random() * 35,
          hue: 260 + Math.random() * 60,
          alpha: 0.06 + Math.random() * 0.08,
          type: 'glow'
        });
      }
      // 柔和线条
      for (let i = 0; i < 8; i++) {
        gardenDecorations.push({
          x: Math.random() * W,
          y: Math.random() * H,
          length: 40 + Math.random() * 80,
          angle: Math.random() * Math.PI,
          hue: 140 + Math.random() * 30,
          alpha: 0.08,
          type: 'vine'
        });
      }
    }

    // ---------- 创建音符 (节奏核心) ----------
    function spawnNote(now, isStrong = false) {
      // 避免音符过于靠边，留出点击区域
      const margin = 65;
      const x = margin + Math.random() * (W - margin * 2);
      const y = margin + Math.random() * (H - margin * 2);

      // 稍微调整位置使其不重叠过多 (简单随机，允许部分重叠以增加挑战)
      notes.push(new Note(x, y, now, isStrong));
    }

    // ---------- 处理点击/触摸 (精确点击检测) ----------
    function handlePointerDown(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;   // canvas 物理像素比例
      const scaleY = H / rect.height;

      let clientX, clientY;

      if (e.touches) {
        // 触摸事件
        if (e.touches.length === 0) return;
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      // 转换为canvas坐标
      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      pointerX = canvasX;
      pointerY = canvasY;
      pointerActive = true;

      // 检测点击音符
      const now = performance.now();
      let hitNote = null;

      // 从后向前遍历（优先点击最新/最上层的音符，但通常重叠少）
      for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        if (note.clicked || note.missed) continue;

        const dx = canvasX - note.x;
        const dy = canvasY - note.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const currentRadius = note.getCurrentRadius(now) + 6; // 宽松点击区域

        if (dist <= currentRadius) {
          hitNote = note;
          break;
        }
      }

      if (hitNote) {
        // 精确命中！
        hitNote.clicked = true;
        combo++;
        if (combo > maxCombo) maxCombo = combo;

        // 计分：基础分 + 连击加成 + 强拍加成
        let basePoints = 100;
        if (hitNote.isStrong) basePoints = 180; // 底鼓重拍
        const comboBonus = Math.floor(combo / 5) * 15;
        score += basePoints + comboBonus;

        // 产生绽放粒子 (花瓣和光点)
        const particleCount = 16 + Math.floor(combo / 3) * 4;
        for (let i = 0; i < particleCount; i++) {
          const typeRand = Math.random();
          let pType = 'petal';
          if (typeRand < 0.65) pType = 'petal';
          else if (typeRand < 0.9) pType = 'spark';
          else pType = 'glow';
          particles.push(new Particle(hitNote.x, hitNote.y, pType, Math.min(combo, 15)));
        }

        // 额外强拍爆发
        if (hitNote.isStrong) {
          for (let i = 0; i < 10; i++) {
            particles.push(new Particle(hitNote.x, hitNote.y, 'spark', 8));
          }
        }

        // 从数组中移除已点击音符
        notes = notes.filter(n => n !== hitNote);
      } else {
        // 点击落空：重置连击 (优雅惩罚)
        combo = 0;
        // 仍然产生少量失落花瓣？ 为了氛围，产生少许暗色粒子
        for (let i = 0; i < 4; i++) {
          particles.push(new Particle(canvasX, canvasY, 'glow', 0));
        }
      }

      updateDisplay();
    }

    function handlePointerUp(e) {
      e.preventDefault();
      pointerActive = false;
    }

    function handlePointerMove(e) {
      // 仅用于更新指针位置（非必要，但可保留）
    }

    // ---------- 更新UI显示 ----------
    function updateDisplay() {
      scoreSpan.textContent = score;
      comboSpan.textContent = combo;
    }

    // ---------- 游戏更新循环 (音符过期、粒子更新) ----------
    function updateGame(now) {
      // 根据时间生成音符 (基于八分音符间隔)
      if (lastNoteTime === 0) {
        lastNoteTime = now;
      }

      // 生成节奏音符
      while (now - lastNoteTime >= noteInterval) {
        // 判断是否为强拍 (底鼓拍)：每两个音符(即每个四分音符)为强拍
        const isStrong = (beatCounter % 2 === 0);
        spawnNote(lastNoteTime, isStrong);
        lastNoteTime += noteInterval;
        beatCounter++;
      }

      // 检查音符过期 (未点击)
      for (let note of notes) {
        if (!note.clicked && !note.missed && note.isExpired(now)) {
          note.missed = true;
          // 错过音符：重置连击
          combo = 0;
          // 产生凋零粒子 (微妙)
          for (let i = 0; i < 6; i++) {
            particles.push(new Particle(note.x, note.y, 'glow', 0));
          }
        }
      }

      // 移除已处理音符 (missed 或 clicked)
      notes = notes.filter(n => !n.missed && !n.clicked);

      // 更新粒子
      for (let p of particles) {
        p.update();
      }
      particles = particles.filter(p => !p.isDead());

      updateDisplay();
    }

    // ---------- 绘制图形 (高雅抽象花园) ----------
    function drawBackground(ctx) {
      // 深邃底色
      ctx.clearRect(0, 0, W, H);

      // 渐变基底
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1b1c2b');
      grad.addColorStop(0.7, '#252334');
      grad.addColorStop(1, '#191b24');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 绘制花园装饰光晕
      for (let dec of gardenDecorations) {
        if (dec.type === 'glow') {
          ctx.beginPath();
          const glowGrad = ctx.createRadialGradient(dec.x, dec.y, 2, dec.x, dec.y, dec.radius);
          glowGrad.addColorStop(0, `hsla(${dec.hue}, 70%, 75%, ${dec.alpha * 1.4})`);
          glowGrad.addColorStop(1, `hsla(${dec.hue}, 70%, 40%, 0)`);
          ctx.fillStyle = glowGrad;
          ctx.arc(dec.x, dec.y, dec.radius, 0, Math.PI*2);
          ctx.fill();
        } else if (dec.type === 'vine') {
          ctx.beginPath();
          ctx.strokeStyle = `hsla(${dec.hue}, 50%, 65%, ${dec.alpha})`;
          ctx.lineWidth = 1.3;
          ctx.moveTo(dec.x, dec.y);
          const endX = dec.x + Math.cos(dec.angle) * dec.length;
          const endY = dec.y + Math.sin(dec.angle) * dec.length * 0.7;
          ctx.lineTo(endX, endY);
          ctx.stroke();
        }
      }
    }

    function drawNotes(ctx, now) {
      for (let note of notes) {
        if (note.clicked || note.missed) continue;
        const radius = note.getCurrentRadius(now);
        const age = now - note.timestamp;
        const lifeProgress = Math.min(1, age / (beatInterval * 1.2));

        // 音符光晕
        ctx.save();
        ctx.translate(note.x, note.y);

        // 外发光 (强拍更亮)
        const glowIntensity = note.isStrong ? 0.9 : 0.55;
        ctx.shadowColor = note.isStrong ? '#ffb86c' : '#d4b8ff';
        ctx.shadowBlur = 18 + Math.sin(age * 0.03) * 4;

        // 绘制音符核心 (抽象种子)
        ctx.beginPath();
        const coreGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, radius);
        if (note.isStrong) {
          coreGrad.addColorStop(0, '#fce3b6');
          coreGrad.addColorStop(0.5, '#e5985c');
          coreGrad.addColorStop(1, '#b45f2a');
        } else {
          coreGrad.addColorStop(0, '#f0e2ff');
          coreGrad.addColorStop(0.6, '#b291d6');
          coreGrad.addColorStop(1, '#4a3065');
        }
        ctx.fillStyle = coreGrad;
        ctx.arc(0, 0, radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        // 内部花瓣纹路
        ctx.strokeStyle = 'rgba(255, 245, 220, 0.7)';
        ctx.lineWidth = 1.4;
        for (let i = 0; i < note.innerPetals; i++) {
          const angle = (i / note.innerPetals) * Math.PI * 2 + note.pulsePhase;
          const innerR = radius * 0.55;
          const x1 = Math.cos(angle) * innerR * 0.5;
          const y1 = Math.sin(angle) * innerR * 0.5;
          const x2 = Math.cos(angle) * innerR;
          const y2 = Math.sin(angle) * innerR;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        // 中心亮点
        ctx.beginPath();
        ctx.arc(0, 0, radius*0.28, 0, 2*Math.PI);
        ctx.fillStyle = '#fff9ef';
        ctx.fill();

        ctx.restore();
      }
    }

    function drawParticles(ctx) {
      for (let p of particles) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.alpha * 0.9;

        if (p.type === 'petal') {
          // 花瓣形状
          ctx.fillStyle = `hsl(${p.hue}, ${p.saturation}%, ${p.lightness}%)`;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.7, p.size * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `hsl(${p.hue}, 75%, 85%)`;
          ctx.ellipse(0, 0, p.size*0.3, p.size*0.15, 0, 0, Math.PI*2);
          ctx.fill();
        } else if (p.type === 'spark') {
          ctx.fillStyle = `hsl(${p.hue}, 90%, 80%)`;
          ctx.shadowColor = `hsl(${p.hue}, 85%, 70%)`;
          ctx.shadowBlur = 9;
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.5, 0, 2*Math.PI);
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = `hsla(${p.hue}, 70%, 80%, 0.7)`;
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.7, 0, 2*Math.PI);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawUIOverlay(ctx) {
      // 轻微装饰文字
      ctx.fillStyle = 'rgba(230, 210, 190, 0.2)';
      ctx.font = 'italic 14px "Cormorant Garamond", serif';
      ctx.fillText('· 韵律花园 ·', 20, 38);
    }

    function renderFrame(now) {
      if (!gameLoopRunning) return;

      updateGame(now);
      drawBackground(ctx);
      drawNotes(ctx, now);
      drawParticles(ctx);
      drawUIOverlay(ctx);

      animationFrameId = requestAnimationFrame(renderFrame);
    }

    // ---------- 事件绑定 ----------
    function bindEvents() {
      // 鼠标事件
      canvas.addEventListener('mousedown', handlePointerDown);
      canvas.addEventListener('mouseup', handlePointerUp);
      // 触摸事件
      canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
      canvas.addEventListener('touchend', handlePointerUp);
      canvas.addEventListener('touchcancel', handlePointerUp);
      // 防止移动端长按菜单
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // ---------- 启动游戏 ----------
    function startGame() {
      initGardenDecor();
      notes = [];
      particles = [];
      score = 0;
      combo = 0;
      maxCombo = 0;
      lastNoteTime = performance.now();
      beatCounter = 0;
      updateDisplay();

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoopRunning = true;
      animationFrameId = requestAnimationFrame(renderFrame);
    }

    bindEvents();
    startGame();

    // 窗口失去焦点时不做特殊处理，保持运行
    window.addEventListener('beforeunload', () => {
      gameLoopRunning = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    });

  })();
</script>
