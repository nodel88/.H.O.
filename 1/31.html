<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, orientation=portrait">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>✨ 星尘解压之旅 · 梦幻粒子宝石 ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    
    :root {
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-left: env(safe-area-inset-left, 0px);
      --safe-area-right: env(safe-area-inset-right, 0px);
    }
    
    body {
      background: #0a0f1e;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    
    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      max-width: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a1f35 0%, #03050a 95%);
      box-shadow: 0 0 60px rgba(120, 100, 255, 0.3);
    }
    
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    
    /* 主菜单覆盖层 */
    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 3, 20, 0.85);
      backdrop-filter: blur(20px);
      z-index: 100;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      padding: 20px;
    }
    
    .menu-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .menu-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: #fff;
      text-shadow: 0 0 30px rgba(200, 180, 255, 0.8), 0 0 60px rgba(150, 120, 255, 0.5);
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 3px;
    }
    
    .menu-subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: #c8b8ff;
      margin-bottom: 40px;
      text-align: center;
      opacity: 0.8;
    }
    
    .menu-btn {
      width: min(280px, 80vw);
      padding: clamp(12px, 2vw, 16px) clamp(20px, 3vw, 30px);
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
    }
    
    .menu-btn:hover, .menu-btn:active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 215, 150, 0.8);
      box-shadow: 0 0 35px rgba(200, 150, 255, 0.6);
      transform: scale(1.02);
    }
    
    .menu-btn.primary {
      background: rgba(180, 130, 255, 0.3);
      border-color: rgba(200, 160, 255, 0.7);
      box-shadow: 0 0 30px rgba(160, 120, 255, 0.5);
    }
    
    /* 游戏UI覆盖层 */
    .ui-overlay {
      position: absolute;
      top: var(--safe-area-top);
      left: var(--safe-area-left);
      width: calc(100% - var(--safe-area-left) - var(--safe-area-right));
      height: calc(100% - var(--safe-area-top) - var(--safe-area-bottom));
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(10px, 2vw, 20px);
      z-index: 10;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .info-badge {
      background: rgba(20, 15, 40, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: clamp(8px, 1.5vw, 12px) clamp(15px, 3vw, 24px);
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 700;
      color: white;
      text-shadow: 0 0 15px rgba(255, 220, 150, 0.8);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    
    .level-badge {
      box-shadow: 0 8px 25px rgba(0,0,0,0.4), 0 0 25px #b388ff;
      border-color: rgba(200, 180, 255, 0.6);
    }
    
    .gem-badge {
      box-shadow: 0 8px 25px rgba(0,0,0,0.4), 0 0 20px #ffb74d;
      border-color: rgba(255, 215, 150, 0.7);
    }
    
    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .theme-indicator {
      background: rgba(10, 5, 25, 0.65);
      backdrop-filter: blur(15px);
      border-radius: 40px;
      padding: clamp(8px, 1.5vw, 12px) clamp(20px, 4vw, 28px);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #ffe8c8;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 200, 0.4);
      box-shadow: 0 0 30px rgba(255, 180, 200, 0.4);
      letter-spacing: 2px;
    }
    
    .theme-dot {
      width: clamp(14px, 3vw, 18px);
      height: clamp(14px, 3vw, 18px);
      border-radius: 50%;
      display: inline-block;
      transition: all 0.5s ease;
    }
    
    /* 控制按钮组 */
    .control-buttons {
      position: absolute;
      pointer-events: auto;
      display: flex;
      gap: 10px;
      z-index: 25;
    }
    
    .top-right-controls {
      top: calc(var(--safe-area-top) + 20px);
      right: calc(var(--safe-area-right) + 20px);
    }
    
    .bottom-right-controls {
      bottom: calc(var(--safe-area-bottom) + 20px);
      right: calc(var(--safe-area-right) + 20px);
    }
    
    .bottom-left-controls {
      bottom: calc(var(--safe-area-bottom) + 20px);
      left: calc(var(--safe-area-left) + 20px);
    }
    
    .icon-btn {
      width: clamp(40px, 8vw, 50px);
      height: clamp(40px, 8vw, 50px);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 200, 0.5);
      color: #ffeaa0;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .icon-btn:hover, .icon-btn:active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 215, 150, 0.9);
      box-shadow: 0 0 25px rgba(255, 180, 100, 0.6);
    }
    
    .save-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ddffdd;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 25px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 30;
      white-space: nowrap;
    }
    
    /* 暂停菜单 */
    .pause-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 10, 30, 0.9);
      backdrop-filter: blur(25px);
      border-radius: 25px;
      padding: clamp(25px, 5vw, 35px);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 90;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      min-width: min(280px, 85vw);
      pointer-events: auto;
    }
    
    .pause-menu.hidden {
      display: none;
    }
    
    .pause-title {
      color: white;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }
    
    .pause-btn {
      padding: clamp(10px, 2vw, 14px) clamp(20px, 4vw, 30px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      font-size: clamp(1rem, 2vw, 1.2rem);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 1px;
    }
    
    .pause-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    /* 响应式调整 */
    @media (max-width: 480px) {
      .top-bar {
        flex-direction: column;
        gap: 8px;
      }
      
      .control-buttons.top-right-controls {
        top: 10px;
        right: 10px;
      }
      
      .icon-btn {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }
    }
    
    @media (min-width: 1200px) {
      .game-container {
        max-width: 900px;
        max-height: 600px;
        border-radius: 20px;
        margin: auto;
      }
    }
  </style>
</head>
<body>
<div class="game-container" id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  
  <!-- 主菜单 -->
  <div class="menu-overlay" id="mainMenu">
    <div class="menu-title">✨ 星尘解压之旅 ✨</div>
    <div class="menu-subtitle">轻触屏幕，释放彩色粒子</div>
    <button class="menu-btn primary" id="startGameBtn">🎮 开始游戏</button>
    <button class="menu-btn" id="continueBtn" style="display:none;">▶️ 继续游戏</button>
    <button class="menu-btn" id="menuSettingsBtn">⚙️ 游戏设置</button>
  </div>
  
  <!-- 暂停菜单 -->
  <div class="pause-menu hidden" id="pauseMenu">
    <div class="pause-title">⏸️ 游戏暂停</div>
    <button class="pause-btn" id="resumeBtn">▶️ 继续游戏</button>
    <button class="pause-btn" id="restartBtn">🔄 重新开始</button>
    <button class="pause-btn" id="quitToMenuBtn">🏠 返回菜单</button>
  </div>
  
  <!-- 游戏UI -->
  <div class="ui-overlay" id="gameUI" style="display:none;">
    <div class="top-bar">
      <div class="info-badge level-badge">
        <span>🌌</span> <span id="levelDisplay">1</span><span>/999</span>
      </div>
      <div class="info-badge gem-badge">
        <span>💎</span> <span id="gemDisplay">0</span>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="theme-indicator">
        <span class="theme-dot" id="themeDot" style="background: #b388ff; box-shadow:0 0 25px #b388ff;"></span>
        <span id="themeName">紫罗兰梦</span>
      </div>
    </div>
  </div>
  
  <!-- 控制按钮 -->
  <div class="control-buttons top-right-controls" id="gameControls" style="display:none;">
    <button class="icon-btn" id="pauseBtn" title="暂停">⏯️</button>
  </div>
  <div class="control-buttons bottom-right-controls" id="fullscreenControls" style="display:none;">
    <button class="icon-btn" id="fullscreenBtn" title="全屏">⛶</button>
  </div>
  <div class="control-buttons bottom-left-controls" id="saveControls" style="display:none;">
    <button class="icon-btn" id="saveBtn" title="保存进度">💾</button>
  </div>
  
  <div class="save-indicator" id="saveIndicator">✔️ 进度已保存</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    
    // UI元素
    const mainMenu = document.getElementById('mainMenu');
    const pauseMenu = document.getElementById('pauseMenu');
    const gameUI = document.getElementById('gameUI');
    const gameControls = document.getElementById('gameControls');
    const fullscreenControls = document.getElementById('fullscreenControls');
    const saveControls = document.getElementById('saveControls');
    const levelDisplay = document.getElementById('levelDisplay');
    const gemDisplay = document.getElementById('gemDisplay');
    const themeDot = document.getElementById('themeDot');
    const themeName = document.getElementById('themeName');
    const saveIndicator = document.getElementById('saveIndicator');
    const continueBtn = document.getElementById('continueBtn');
    
    // 游戏状态
    let currentLevel = 1;
    let gemsCollected = 0;
    let themeIndex = 0;
    let isPaused = false;
    let isGameActive = false;
    const totalLevels = 999;
    
    // 设置
    let settings = {
      musicVolume: 0.12,
      sfxVolume: 0.15,
      particleDensity: 1.0,
    };
    
    // 五大色彩主题
    const themes = [
      { name: '紫罗兰梦', color: '#b388ff', particleBase: '#d1b3ff', gemColor: '#e0b0ff', bgHint: '#2a1a4a' },
      { name: '深海蓝调', color: '#4fc3f7', particleBase: '#81d4fa', gemColor: '#80deea', bgHint: '#0a1a2a' },
      { name: '玫瑰暮光', color: '#f8bbd0', particleBase: '#f48fb1', gemColor: '#ff80ab', bgHint: '#2a1520' },
      { name: '翡翠森林', color: '#81c784', particleBase: '#a5d6a7', gemColor: '#b9f6ca', bgHint: '#1a2a1a' },
      { name: '金色夕阳', color: '#ffb74d', particleBase: '#ffcc80', gemColor: '#ffd54f', bgHint: '#2a2010' }
    ];
    
    // 动态对象
    let meteors = [];
    let particles = [];
    let gems = [];
    
    // 指针状态
    let pointerX = 0, pointerY = 0;
    let pointerDown = false;
    let pointerActive = false;
    
    // 音频
    let audioCtx = null;
    let musicGain = null;
    let sfxGain = null;
    let isMusicPlaying = false;
    
    // 尺寸
    let width, height;
    let dpr = 1;
    
    // 动画帧
    let animationId = null;
    
    // ----- 音频系统 -----
    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = audioCtx.createGain();
        sfxGain = audioCtx.createGain();
        musicGain.gain.value = settings.musicVolume;
        sfxGain.gain.value = settings.sfxVolume;
        musicGain.connect(audioCtx.destination);
        sfxGain.connect(audioCtx.destination);
      } catch (e) {
        console.log("音频不可用");
      }
    }
    
    function playPianoNote(freq, duration = 0.6, vol = 0.08, isMusic = true) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(isMusic ? musicGain : sfxGain);
      osc.start(now);
      osc.stop(now + duration);
    }
    
    function startMelodyLoop() {
      if (!audioCtx || isMusicPlaying) return;
      isMusicPlaying = true;
      const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
      let timeoutId;
      function playNext() {
        if (!isMusicPlaying || isPaused) {
          timeoutId = setTimeout(playNext, 1000);
          return;
        }
        const note = notes[Math.floor(Math.random() * notes.length)];
        playPianoNote(note, 0.7, settings.musicVolume * 0.6, true);
        timeoutId = setTimeout(playNext, 500 + Math.random() * 800);
      }
      playNext();
      return () => clearTimeout(timeoutId);
    }
    
    function stopMelody() {
      isMusicPlaying = false;
    }
    
    function playGemSound() {
      playPianoNote(880, 0.2, settings.sfxVolume, false);
      setTimeout(() => playPianoNote(1100, 0.18, settings.sfxVolume * 0.8, false), 100);
    }
    
    function playMeteorBreakSound() {
      playPianoNote(180, 0.15, settings.sfxVolume * 0.7, false);
      setTimeout(() => playPianoNote(150, 0.12, settings.sfxVolume * 0.6, false), 80);
    }
    
    function playLevelUpSound() {
      playPianoNote(523.25, 0.3, settings.sfxVolume * 0.9, false);
      setTimeout(() => playPianoNote(659.25, 0.3, settings.sfxVolume * 0.9, false), 150);
      setTimeout(() => playPianoNote(783.99, 0.4, settings.sfxVolume, false), 300);
    }
    
    // ----- Canvas尺寸管理 -----
    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制像素比以保证性能
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    
    // ----- 游戏逻辑 -----
    function getTheme() {
      return themes[themeIndex % themes.length];
    }
    
    function spawnMeteor() {
      const theme = getTheme();
      const radius = 20 + Math.random() * 35;
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() * width;
        y = -radius;
      } else {
        x = Math.random() * width;
        y = height + radius;
      }
      meteors.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.8,
        vy: (Math.random() * 1.2 + 0.5) * (y < height/2 ? 1 : -1),
        radius: radius,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.08,
        color: theme.color,
        health: 2 + Math.floor(Math.random() * 3),
      });
    }
    
    function spawnGem(x, y) {
      const theme = getTheme();
      gems.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() * -0.8 - 0.7),
        radius: 10 + Math.random() * 8,
        collected: false,
        color: theme.gemColor,
        sparkle: 0,
      });
    }
    
    function handleInteraction(clientX, clientY) {
      if (!isGameActive || isPaused) return;
      
      const rect = canvas.getBoundingClientRect();
      const canvasX = (clientX - rect.left) * (width / rect.width);
      const canvasY = (clientY - rect.top) * (height / rect.height);
      
      pointerX = canvasX;
      pointerY = canvasY;
      pointerActive = true;
      
      // 释放粒子
      const theme = getTheme();
      const particleCount = Math.floor((12 + Math.random() * 12) * settings.particleDensity);
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 7;
        particles.push({
          x: canvasX,
          y: canvasY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 5,
          life: 0.7 + Math.random() * 0.8,
          maxLife: 0.7 + Math.random() * 0.8,
          color: theme.particleBase,
        });
      }
      
      // 检测陨石碰撞
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        const dx = canvasX - m.x;
        const dy = canvasY - m.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < m.radius + 15) {
          m.health--;
          playMeteorBreakSound();
          // 破碎粒子
          for (let j = 0; j < 8; j++) {
            particles.push({
              x: m.x, y: m.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              radius: 2 + Math.random() * 4,
              life: 0.5,
              maxLife: 0.5,
              color: theme.color,
            });
          }
          if (m.health <= 0) {
            spawnGem(m.x, m.y);
            meteors.splice(i, 1);
          }
          break;
        }
      }
    }
    
    // 事件处理
    function onPointerDown(e) {
      e.preventDefault();
      pointerDown = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      handleInteraction(clientX, clientY);
      
      if (!audioCtx) {
        initAudio();
        startMelodyLoop();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        if (!isMusicPlaying) startMelodyLoop();
      }
    }
    
    function onPointerMove(e) {
      if (!pointerDown || !isGameActive) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      handleInteraction(clientX, clientY);
    }
    
    function onPointerUp(e) {
      e.preventDefault();
      pointerDown = false;
      pointerActive = false;
    }
    
    function update() {
      if (!isGameActive || isPaused) return;
      
      // 粒子更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.012;
        if (p.life <= 0 || p.x < -20 || p.x > width+20 || p.y < -20 || p.y > height+20) {
          particles.splice(i,1);
        }
      }
      
      // 陨石更新
      for (let m of meteors) {
        m.x += m.vx;
        m.y += m.vy;
        m.rotation += m.rotSpeed;
        if (m.x - m.radius < 0) { m.x = m.radius; m.vx *= -0.9; }
        if (m.x + m.radius > width) { m.x = width - m.radius; m.vx *= -0.9; }
        if (m.y - m.radius < 0) { m.y = m.radius; m.vy *= -0.9; }
        if (m.y + m.radius > height) { m.y = height - m.radius; m.vy *= -0.9; }
      }
      
      // 宝石更新
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.x += g.vx;
        g.y += g.vy;
        g.vy += 0.06;
        g.sparkle += 0.1;
        if (g.y > height + 30 || g.x < -30 || g.x > width+30) {
          gems.splice(i,1);
          continue;
        }
        // 自动吸附收集
        if (pointerActive) {
          const dx = pointerX - g.x;
          const dy = pointerY - g.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < 55) {
            gemsCollected++;
            playGemSound();
            gems.splice(i,1);
            updateUI();
            // 升级检查
            if (gemsCollected % 5 === 0 && currentLevel < totalLevels) {
              currentLevel++;
              themeIndex = (currentLevel - 1) % themes.length;
              playLevelUpSound();
              updateUI();
              if (meteors.length < 4 + Math.floor(currentLevel/3)) {
                spawnMeteor();
              }
            }
          }
        }
      }
      
      // 维持陨石数量
      const targetMeteorCount = Math.min(3 + Math.floor(currentLevel / 5), 8);
      while (meteors.length < targetMeteorCount) {
        spawnMeteor();
      }
      
      // 随机生成宝石
      if (Math.random() < 0.002 && gems.length < 6) {
        spawnGem(Math.random() * width, -10);
      }
    }
    
    function updateUI() {
      levelDisplay.textContent = currentLevel;
      gemDisplay.textContent = gemsCollected;
      const theme = getTheme();
      themeDot.style.background = theme.color;
      themeDot.style.boxShadow = `0 0 25px ${theme.color}`;
      themeName.textContent = theme.name;
    }
    
    function draw() {
      ctx.clearRect(0, 0, width, height);
      const theme = getTheme();
      
      // 背景
      const grad = ctx.createLinearGradient(0, 0, width*0.6, height);
      grad.addColorStop(0, theme.bgHint);
      grad.addColorStop(0.7, '#0a0c18');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      
      // 星星
      ctx.fillStyle = 'rgba(255,255,200,0.15)';
      const starSeed = 42;
      for (let i=0; i<40; i++) {
        let sx = ((i*23 + starSeed) * 1.7 + Date.now()*0.005) % width;
        let sy = (i*17 * 1.3) % height;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.2, 0, Math.PI*2);
        ctx.fill();
      }
      
      // 粒子
      for (let p of particles) {
        ctx.globalAlpha = p.life * 0.9;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
        ctx.fill();
      }
      
      // 陨石
      for (let m of meteors) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rotation);
        ctx.shadowColor = m.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = m.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i=0; i<7; i++) {
          let angle = (i/7)*Math.PI*2;
          let r = m.radius * (0.75 + Math.sin(i*4.5)*0.2);
          let x = Math.cos(angle)*r;
          let y = Math.sin(angle)*r;
          if (i===0) ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        if (m.health > 1) {
          ctx.fillStyle = 'white';
          ctx.font = `${Math.max(12, m.radius * 0.4)}px "Quicksand"`;
          ctx.shadowBlur = 8;
          ctx.fillText('●'.repeat(m.health-1), -8, 4);
        }
        ctx.restore();
      }
      
      // 宝石
      for (let g of gems) {
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 18;
        let sparkle = Math.sin(g.sparkle)*0.3 + 0.7;
        ctx.fillStyle = g.color;
        ctx.globalAlpha = sparkle;
        ctx.beginPath();
        ctx.moveTo(0, -g.radius);
        ctx.lineTo(g.radius*0.7, 0);
        ctx.lineTo(0, g.radius*0.9);
        ctx.lineTo(-g.radius*0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(0, -g.radius*0.3, g.radius*0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      
      // 暂停时绘制暗色覆盖
      if (isPaused && isGameActive) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = 'white';
        ctx.font = `${Math.max(20, width * 0.04)}px "Quicksand"`;
        ctx.textAlign = 'center';
        ctx.fillText('⏸️ 已暂停', width/2, height/2);
      }
    }
    
    function gameLoop() {
      update();
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }
    
    // ----- 游戏流程控制 -----
    function showMainMenu() {
      mainMenu.classList.remove('hidden');
      pauseMenu.classList.add('hidden');
      gameUI.style.display = 'none';
      gameControls.style.display = 'none';
      fullscreenControls.style.display = 'none';
      saveControls.style.display = 'none';
      isGameActive = false;
      isPaused = false;
      pointerDown = false;
      pointerActive = false;
      
      // 检查存档
      const saved = localStorage.getItem('stardustRelaxGame');
      if (saved) {
        continueBtn.style.display = 'block';
      } else {
        continueBtn.style.display = 'none';
      }
    }
    
    function startNewGame() {
      currentLevel = 1;
      gemsCollected = 0;
      themeIndex = 0;
      meteors = [];
      particles = [];
      gems = [];
      pointerActive = false;
      pointerDown = false;
      
      mainMenu.classList.add('hidden');
      pauseMenu.classList.add('hidden');
      gameUI.style.display = 'flex';
      gameControls.style.display = 'flex';
      fullscreenControls.style.display = 'flex';
      saveControls.style.display = 'flex';
      isGameActive = true;
      isPaused = false;
      
      updateUI();
      for (let i=0; i<4; i++) spawnMeteor();
      
      if (!audioCtx) {
        initAudio();
        startMelodyLoop();
      }
    }
    
    function continueGame() {
      const saved = localStorage.getItem('stardustRelaxGame');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          currentLevel = data.level || 1;
          gemsCollected = data.gems || 0;
          themeIndex = data.themeIdx || 0;
        } catch(e) {
          currentLevel = 1;
          gemsCollected = 0;
          themeIndex = 0;
        }
      }
      
      meteors = [];
      particles = [];
      gems = [];
      pointerActive = false;
      pointerDown = false;
      
      mainMenu.classList.add('hidden');
      pauseMenu.classList.add('hidden');
      gameUI.style.display = 'flex';
      gameControls.style.display = 'flex';
      fullscreenControls.style.display = 'flex';
      saveControls.style.display = 'flex';
      isGameActive = true;
      isPaused = false;
      
      updateUI();
      for (let i=0; i<4; i++) spawnMeteor();
      
      if (!audioCtx) {
        initAudio();
        startMelodyLoop();
      }
    }
    
    function togglePause() {
      if (!isGameActive) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseMenu.classList.remove('hidden');
        if (musicGain) musicGain.gain.value = settings.musicVolume * 0.3;
      } else {
        pauseMenu.classList.add('hidden');
        if (musicGain) musicGain.gain.value = settings.musicVolume;
      }
    }
    
    function restartGame() {
      currentLevel = 1;
      gemsCollected = 0;
      themeIndex = 0;
      meteors = [];
      particles = [];
      gems = [];
      pointerActive = false;
      pointerDown = false;
      isPaused = false;
      pauseMenu.classList.add('hidden');
      updateUI();
      for (let i=0; i<4; i++) spawnMeteor();
    }
    
    function quitToMenu() {
      isGameActive = false;
      isPaused = false;
      stopMelody();
      meteors = [];
      particles = [];
      gems = [];
      showMainMenu();
    }
    
    function saveProgress() {
      const gameState = {
        level: currentLevel,
        gems: gemsCollected,
        themeIdx: themeIndex,
      };
      localStorage.setItem('stardustRelaxGame', JSON.stringify(gameState));
      saveIndicator.style.opacity = '1';
      setTimeout(() => { saveIndicator.style.opacity = '0'; }, 1500);
    }
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {
          // 某些移动浏览器不支持全屏，静默处理
        });
      } else {
        document.exitFullscreen();
      }
    }
    
    // ----- 事件绑定 -----
    function bindEvents() {
      // 指针事件
      canvas.addEventListener('touchstart', onPointerDown, {passive: false});
      canvas.addEventListener('touchmove', onPointerMove, {passive: false});
      canvas.addEventListener('touchend', onPointerUp);
      canvas.addEventListener('touchcancel', onPointerUp);
      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', (e) => {
        if (pointerDown && isGameActive) onPointerMove(e);
        const rect = canvas.getBoundingClientRect();
        pointerX = (e.clientX - rect.left) * (width / rect.width);
        pointerY = (e.clientY - rect.top) * (height / rect.height);
      });
      window.addEventListener('mouseup', onPointerUp);
      
      // 菜单按钮
      document.getElementById('startGameBtn').addEventListener('click', startNewGame);
      document.getElementById('continueBtn').addEventListener('click', continueGame);
      document.getElementById('menuSettingsBtn').addEventListener('click', () => {
        alert('⚙️ 设置功能：\n\n• 音乐音量：背景钢琴配乐\n• 音效音量：收集宝石与破碎音效\n• 粒子密度：触屏释放粒子数量\n\n（完整设置面板可在暂停菜单中调整）');
      });
      
      // 暂停菜单
      document.getElementById('pauseBtn').addEventListener('click', togglePause);
      document.getElementById('resumeBtn').addEventListener('click', togglePause);
      document.getElementById('restartBtn').addEventListener('click', restartGame);
      document.getElementById('quitToMenuBtn').addEventListener('click', quitToMenu);
      
      // 功能按钮
      document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
      document.getElementById('saveBtn').addEventListener('click', saveProgress);
      
      // 窗口调整
      window.addEventListener('resize', () => {
        resizeCanvas();
        updateUI();
      });
      
      // 防止iOS橡皮筋效果
      document.body.addEventListener('touchmove', (e) => {
        if (e.target === canvas) {
          e.preventDefault();
        }
      }, {passive: false});
      
      // 键盘快捷键
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isGameActive) {
          togglePause();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        } else if (e.key === 's' && e.ctrlKey) {
          e.preventDefault();
          saveProgress();
        }
      });
    }
    
    // 初始化
    function init() {
      resizeCanvas();
      bindEvents();
      showMainMenu();
      gameLoop();
    }
    
    init();
  })();
</script>
</body>
