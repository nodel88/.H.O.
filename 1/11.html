<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>艺境 · 泡泡律动 | 艺术闯关</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0c0f;
      font-family: 'Segoe UI', 'PingFang SC', system-ui, -apple-system, sans-serif;
      touch-action: pan-x pan-y;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #1a1e2b, #03050a);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      touch-action: none;
    }

    #fullscreen-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: rgba(20, 25, 35, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.25s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #fullscreen-btn:active {
      transform: scale(0.92);
      background: rgba(50, 60, 80, 0.8);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .level-hint {
      position: fixed;
      bottom: 24px;
      left: 24px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 400;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 40px;
      z-index: 999;
      pointer-events: none;
      border: 0.5px solid rgba(255,255,255,0.2);
    }

    @media (max-width: 600px) {
      #fullscreen-btn {
        width: 42px;
        height: 42px;
        top: 16px;
        right: 16px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="artCanvas" aria-label="艺术闯关游戏画布"></canvas>
  </div>
  
  <button id="fullscreen-btn" title="全屏模式 (沉浸艺术)" aria-label="进入全屏">⛶</button>
  
  <div class="level-hint" id="levelDisplay">关 · 1</div>

  <script>
    (function() {
      const canvas = document.getElementById('artCanvas');
      const ctx = canvas.getContext('2d');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const levelDisplay = document.getElementById('levelDisplay');

      let W, H;
      function resizeCanvas() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let audioCtx = null;
      let masterGain = null;
      let currentMusicGain = null;
      let currentMusicNodes = [];
      let musicInterval = null;
      
      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.5;
          masterGain.connect(audioCtx.destination);
        } catch (e) {
          console.warn("音频初始化失败", e);
        }
      }

      function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function stopMusic() {
        if (musicInterval) {
          clearInterval(musicInterval);
          musicInterval = null;
        }
        if (currentMusicGain) {
          currentMusicGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
          setTimeout(() => {
            if (currentMusicGain) {
              currentMusicGain.disconnect();
              currentMusicGain = null;
            }
          }, 250);
        }
        currentMusicNodes.forEach(n => {
          try { n.stop(); } catch(e) {}
        });
        currentMusicNodes = [];
      }

      // 可爱泡泡风格音乐生成器
      function playLevelMusic(level) {
        if (!audioCtx) return;
        stopMusic();
        
        const now = audioCtx.currentTime;
        const musicGain = audioCtx.createGain();
        musicGain.gain.value = 0;
        musicGain.connect(masterGain);
        musicGain.gain.linearRampToValueAtTime(0.2, now + 0.3);
        currentMusicGain = musicGain;

        // 泡泡音阶：明亮的大调五声音阶
        const bubbleScale = [262, 294, 330, 392, 440, 523, 587, 659, 784];
        // 根据关卡选择不同的音高范围
        const scaleOffset = (level % 3) * 2;
        const availableNotes = bubbleScale.slice(scaleOffset, scaleOffset + 5);
        
        // 创建泡泡音色：使用正弦波 + 快速衰减 + 轻微颤音
        function playBubbleNote(freq, time, duration = 0.3) {
          const osc = audioCtx.createOscillator();
          const oscGain = audioCtx.createGain();
          const vibrato = audioCtx.createOscillator();
          const vibratoGain = audioCtx.createGain();
          
          // 主音色：圆润的正弦波
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          // 添加轻微颤音（泡泡感）
          vibrato.type = 'sine';
          vibrato.frequency.value = 5 + Math.random() * 3;
          vibratoGain.gain.value = 2;
          vibrato.connect(vibratoGain);
          vibratoGain.connect(osc.frequency);
          
          osc.connect(oscGain);
          oscGain.connect(musicGain);
          
          // 泡泡般的音量包络：快速弹出然后逐渐消失
          oscGain.gain.setValueAtTime(0, time);
          oscGain.gain.linearRampToValueAtTime(0.15, time + 0.02);
          oscGain.gain.exponentialRampToValueAtTime(0.001, time + duration);
          
          osc.start(time);
          osc.stop(time + duration + 0.05);
          vibrato.start(time);
          vibrato.stop(time + duration + 0.05);
          
          currentMusicNodes.push(osc, vibrato);
        }

        // 播放泡泡和弦（可爱的大三和弦）
        function playBubbleChord(rootFreq, time) {
          const chordIntervals = [1, 1.25, 1.5]; // 大三和弦
          chordIntervals.forEach(interval => {
            playBubbleNote(rootFreq * interval, time, 0.4 + Math.random() * 0.2);
          });
        }

        // 添加泡泡音效（高频点缀）
        function playBubblePop(time) {
          const osc = audioCtx.createOscillator();
          const oscGain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 800 + Math.random() * 600;
          osc.connect(oscGain);
          oscGain.connect(musicGain);
          oscGain.gain.setValueAtTime(0, time);
          oscGain.gain.linearRampToValueAtTime(0.08, time + 0.01);
          oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
          osc.start(time);
          osc.stop(time + 0.2);
          currentMusicNodes.push(osc);
        }

        // 主旋律循环：根据关卡变化节奏模式
        const baseTempo = 0.3 + level * 0.05; // 关卡越高节奏稍快
        let beatCount = 0;
        
        function scheduleMelody() {
          if (!currentMusicGain) return;
          const currentTime = audioCtx.currentTime;
          const nextTime = currentTime + 0.1;
          
          // 每拍播放音符
          if (beatCount % 2 === 0) {
            // 主音符
            const noteIndex = (beatCount + level) % availableNotes.length;
            playBubbleNote(availableNotes[noteIndex], nextTime, 0.25);
            
            // 偶尔添加和弦
            if (beatCount % 4 === 0) {
              playBubbleChord(availableNotes[noteIndex], nextTime + 0.05);
            }
          } else {
            // 弱拍：轻快的泡泡声
            if (Math.random() > 0.4) {
              playBubblePop(nextTime);
            }
          }
          
          // 每8拍添加特殊泡泡音效
          if (beatCount % 8 === 0) {
            const highNote = availableNotes[availableNotes.length - 1] * 1.5;
            playBubbleNote(highNote, nextTime + 0.1, 0.2);
            playBubblePop(nextTime + 0.15);
          }
          
          beatCount++;
        }

        // 初始和弦开场
        playBubbleChord(availableNotes[0], now + 0.1);
        playBubblePop(now + 0.2);
        
        // 设置循环
        musicInterval = setInterval(() => {
          if (audioCtx && audioCtx.state === 'running') {
            scheduleMelody();
          }
        }, baseTempo * 1000);
        
        // 立即触发第一个音符
        setTimeout(() => scheduleMelody(), 100);
      }

      function playSFX(type, level) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const sfxGain = audioCtx.createGain();
        sfxGain.gain.value = 0.25;
        sfxGain.connect(masterGain);
        
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.connect(oscGain);
        oscGain.connect(sfxGain);
        
        if (type === 'collect') {
          // 可爱的收集音效
          osc.type = 'sine';
          osc.frequency.value = 700 + level * 40;
          oscGain.gain.setValueAtTime(0.3, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.25);
          
          // 添加第二个泡泡音
          const osc2 = audioCtx.createOscillator();
          const g2 = audioCtx.createGain();
          osc2.connect(g2);
          g2.connect(sfxGain);
          osc2.type = 'sine';
          osc2.frequency.value = 900 + level * 40;
          g2.gain.setValueAtTime(0.2, now + 0.05);
          g2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc2.start(now + 0.05);
          osc2.stop(now + 0.3);
        } else if (type === 'nextLevel') {
          // 升级泡泡音阶
          const notes = [523, 659, 784, 1047];
          notes.forEach((freq, i) => {
            const oscN = audioCtx.createOscillator();
            const gN = audioCtx.createGain();
            oscN.connect(gN);
            gN.connect(sfxGain);
            oscN.type = 'sine';
            oscN.frequency.value = freq;
            gN.gain.setValueAtTime(0.2, now + i * 0.1);
            gN.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.2);
            oscN.start(now + i * 0.1);
            oscN.stop(now + i * 0.1 + 0.25);
          });
        }
      }

      const TOTAL_LEVELS = 5;
      let currentLevel = 1;
      let player = { x: 0, y: 0, radius: 0 };
      let targets = [];
      let particles = [];
      let collectedCount = 0;
      let levelComplete = false;
      let transitionTimer = 0;
      let floatingOrbs = [];
      
      function resetPlayerPosition() {
        player.radius = Math.min(W, H) * 0.045;
        player.x = W * 0.15;
        player.y = H * 0.5;
      }

      function generateTargets(level) {
        const count = 3 + level;
        const newTargets = [];
        const margin = player.radius * 3;
        for (let i = 0; i < count; i++) {
          let attempts = 0;
          let placed = false;
          while (!placed && attempts < 200) {
            const tx = margin + Math.random() * (W - margin * 2);
            const ty = margin + Math.random() * (H - margin * 2);
            const distToPlayer = Math.hypot(tx - player.x, ty - player.y);
            if (distToPlayer > player.radius * 4) {
              newTargets.push({
                x: tx,
                y: ty,
                radius: player.radius * 0.9,
                collected: false,
                pulse: Math.random() * Math.PI * 2,
                colorAngle: Math.random() * 360
              });
              placed = true;
            }
            attempts++;
          }
          if (!placed) {
            newTargets.push({
              x: W * 0.7 + Math.random() * 80,
              y: H * 0.5 + Math.random() * 100,
              radius: player.radius * 0.9,
              collected: false,
              pulse: 0,
              colorAngle: 0
            });
          }
        }
        return newTargets;
      }

      function loadLevel(level) {
        stopMusic();
        resetPlayerPosition();
        targets = generateTargets(level);
        collectedCount = 0;
        levelComplete = false;
        transitionTimer = 0;
        particles = [];
        floatingOrbs = [];
        for (let i = 0; i < 8 + level * 2; i++) {
          floatingOrbs.push({
            x: Math.random() * W,
            y: Math.random() * H,
            radius: 4 + Math.random() * 20,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            hue: (level * 40 + i * 20) % 360
          });
        }
        
        levelDisplay.textContent = `关 · ${level}`;
        playLevelMusic(level);
        setTimeout(() => playSFX('nextLevel', level), 100);
      }

      function goToNextLevel() {
        if (currentLevel < TOTAL_LEVELS) {
          currentLevel++;
          loadLevel(currentLevel);
        } else {
          currentLevel = 1;
          loadLevel(currentLevel);
          for (let i=0;i<30;i++) {
            particles.push(createParticle(W/2, H/2, 'gold'));
          }
        }
      }

      function collectTarget(index) {
        if (index < 0 || index >= targets.length || targets[index].collected) return;
        targets[index].collected = true;
        collectedCount++;
        playSFX('collect', currentLevel);
        
        const tx = targets[index].x;
        const ty = targets[index].y;
        for (let i=0;i<12;i++) {
          particles.push(createParticle(tx, ty, 'collect'));
        }
        
        if (collectedCount >= targets.length) {
          levelComplete = true;
          transitionTimer = 0;
          playSFX('nextLevel', currentLevel);
        }
      }

      function createParticle(x, y, type) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        return {
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.7 + Math.random() * 0.8,
          maxLife: 0.9,
          type: type,
          size: 2 + Math.random() * 6,
          hue: (currentLevel * 50 + Math.random() * 60) % 360
        };
      }

      function movePlayerTo(clientX, clientY) {
        if (levelComplete) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        
        let canvasX = (clientX - rect.left) * scaleX;
        let canvasY = (clientY - rect.top) * scaleY;
        
        canvasX = Math.min(Math.max(canvasX, player.radius), W - player.radius);
        canvasY = Math.min(Math.max(canvasY, player.radius), H - player.radius);
        
        player.x = canvasX;
        player.y = canvasY;
        
        for (let i = 0; i < targets.length; i++) {
          const t = targets[i];
          if (t.collected) continue;
          const dist = Math.hypot(player.x - t.x, player.y - t.y);
          if (dist < player.radius + t.radius) {
            collectTarget(i);
          }
        }
      }

      function handleStart(e) {
        e.preventDefault();
        resumeAudio();
        initAudio();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        movePlayerTo(clientX, clientY);
      }

      function handleMove(e) {
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        movePlayerTo(clientX, clientY);
      }

      function handleEnd(e) {
        e.preventDefault();
      }

      canvas.addEventListener('mousedown', handleStart);
      canvas.addEventListener('mousemove', (e) => {
        if (e.buttons === 1) {
          handleMove(e);
        }
      });
      canvas.addEventListener('mouseup', handleEnd);
      canvas.addEventListener('touchstart', handleStart, { passive: false });
      canvas.addEventListener('touchmove', handleMove, { passive: false });
      canvas.addEventListener('touchend', handleEnd);
      canvas.addEventListener('touchcancel', handleEnd);
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      function toggleFullscreen() {
        resumeAudio();
        initAudio();
        const elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      }

      fullscreenBtn.addEventListener('click', toggleFullscreen);
      fullscreenBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        toggleFullscreen();
      });

      function updateFullscreenIcon() {
        const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
        fullscreenBtn.innerHTML = isFull ? '✕' : '⛶';
      }
      document.addEventListener('fullscreenchange', updateFullscreenIcon);
      document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, W, H);
        const hue1 = (currentLevel * 25 + Date.now() * 0.002) % 360;
        const hue2 = (hue1 + 60) % 360;
        grad.addColorStop(0, `hsla(${hue1}, 70%, 8%, 1)`);
        grad.addColorStop(0.6, `hsla(${hue2}, 70%, 12%, 1)`);
        grad.addColorStop(1, `hsla(${hue1+30}, 80%, 5%, 1)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        
        ctx.strokeStyle = `hsla(${hue1}, 70%, 60%, 0.08)`;
        ctx.lineWidth = 1;
        const step = 50;
        for (let i = 0; i < W; i += step) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, H);
          ctx.stroke();
        }
        for (let j = 0; j < H; j += step) {
          ctx.beginPath();
          ctx.moveTo(0, j);
          ctx.lineTo(W, j);
          ctx.stroke();
        }
      }

      function drawFloatingOrbs() {
        for (let orb of floatingOrbs) {
          orb.x += orb.speedX;
          orb.y += orb.speedY;
          if (orb.x < 0) orb.x = W;
          if (orb.x > W) orb.x = 0;
          if (orb.y < 0) orb.y = H;
          if (orb.y > H) orb.y = 0;
          
          ctx.beginPath();
          ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI*2);
          ctx.fillStyle = `hsla(${orb.hue}, 80%, 70%, 0.2)`;
          ctx.fill();
          ctx.strokeStyle = `hsla(${orb.hue}, 80%, 80%, 0.5)`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      function drawTargets() {
        const time = Date.now() * 0.002;
        for (let t of targets) {
          if (t.collected) continue;
          const pulse = Math.sin(time * 3 + t.pulse) * 0.2 + 0.8;
          const r = t.radius * pulse;
          
          const gradient = ctx.createRadialGradient(t.x, t.y, r*0.2, t.x, t.y, r*1.8);
          gradient.addColorStop(0, `hsla(${t.colorAngle}, 90%, 75%, 0.9)`);
          gradient.addColorStop(0.5, `hsla(${t.colorAngle}, 85%, 60%, 0.5)`);
          gradient.addColorStop(1, `hsla(${t.colorAngle}, 80%, 40%, 0)`);
          ctx.beginPath();
          ctx.arc(t.x, t.y, r*1.8, 0, Math.PI*2);
          ctx.fillStyle = gradient;
          ctx.fill();
          
          ctx.beginPath();
          ctx.arc(t.x, t.y, r, 0, Math.PI*2);
          ctx.fillStyle = `hsla(${t.colorAngle}, 90%, 85%, 0.95)`;
          ctx.fill();
          ctx.shadowColor = `hsla(${t.colorAngle}, 90%, 70%, 0.7)`;
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        const time = Date.now() * 0.003;
        const hue = (currentLevel * 40 + time * 20) % 360;
        
        ctx.beginPath();
        ctx.arc(0, 0, player.radius * 1.4, 0, Math.PI*2);
        const glow = ctx.createRadialGradient(0,0,player.radius*0.5, 0,0,player.radius*1.5);
        glow.addColorStop(0, `hsla(${hue}, 85%, 70%, 0.6)`);
        glow.addColorStop(1, `hsla(${hue}, 90%, 50%, 0)`);
        ctx.fillStyle = glow;
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${hue}, 80%, 75%, 0.9)`;
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(0, 0, player.radius*0.6, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${hue}, 70%, 90%, 0.8)`;
        ctx.fill();
        ctx.restore();
      }

      function drawParticles() {
        for (let i = particles.length-1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.015;
          if (p.life <= 0) {
            particles.splice(i,1);
            continue;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (p.life/p.maxLife), 0, Math.PI*2);
          ctx.fillStyle = `hsla(${p.hue}, 85%, 70%, ${p.life*0.9})`;
          ctx.fill();
        }
      }

      function drawLevelCompleteEffect() {
        if (!levelComplete) return;
        transitionTimer += 0.016;
        const alpha = Math.min(transitionTimer * 1.2, 0.7);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.2})`;
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.font = `bold ${Math.min(W*0.08, 48)}px "PingFang SC", "Segoe UI"`;
        ctx.textAlign = "center";
        ctx.fillText("艺境 · 升华", W/2, H/2 - 20);
        
        if (transitionTimer > 1.8) {
          goToNextLevel();
        }
      }

      function gameLoop() {
        resizeCanvas();
        drawBackground();
        drawFloatingOrbs();
        drawTargets();
        drawPlayer();
        drawParticles();
        drawLevelCompleteEffect();
        
        requestAnimationFrame(gameLoop);
      }

      initAudio();
      loadLevel(1);
      gameLoop();
      
      document.body.addEventListener('touchstart', resumeAudio, { once: true });
      document.body.addEventListener('click', resumeAudio, { once: true });
    })();
  </script>
</body>
</html>
