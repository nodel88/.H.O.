<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation, viewport-fit=cover">
  <title>✨ 星尘解压之旅 · 梦幻粒子宝石 ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0f1e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      touch-action: pan-x pan-y; 
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a1f35 0%, #03050a 95%);
      box-shadow: 0 0 60px rgba(120, 100, 255, 0.3);
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none; /* 由JS控制触摸事件 */
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: white;
      text-shadow: 0 0 20px rgba(255, 220, 150, 0.8);
      font-weight: 500;
      letter-spacing: 1px;
      pointer-events: none;
    }
    .level-info {
      background: rgba(20, 15, 40, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 10px 24px;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 25px #b388ff;
      border: 1px solid rgba(255, 200, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gem-counter {
      background: rgba(25, 15, 45, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 20px #ffb74d;
      border: 1px solid rgba(255, 215, 150, 0.7);
    }
    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
    }
    .theme-indicator {
      background: rgba(10, 5, 25, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 40px;
      padding: 12px 28px;
      font-size: 1.2rem;
      color: #ffe8c8;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 200, 0.4);
      box-shadow: 0 0 35px rgba(255, 180, 200, 0.5);
      letter-spacing: 2px;
    }
    .theme-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 20px currentColor;
    }
    .save-indicator {
      position: absolute;
      top: 30px;
      right: 30px;
      color: #ddddff;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      pointer-events: none;
    }
    button {
      pointer-events: auto;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 50px;
      padding: 12px 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      margin-left: 15px;
    }
    button:hover {
      background: rgba(255,255,255,0.28);
      border-color: rgba(255,215,150,0.8);
      box-shadow: 0 0 30px #ffaa80;
    }
    .fullscreen-btn {
      pointer-events: auto;
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 1px solid rgba(255,255,200,0.5);
      color: #ffeaa0;
      cursor: pointer;
      z-index: 25;
    }
    @media (max-width: 600px) {
      .level-info, .gem-counter {
        font-size: 1.2rem;
        padding: 8px 18px;
      }
      .theme-indicator {
        font-size: 1rem;
        padding: 8px 20px;
      }
    }
  </style>
</head>
<body>
<div class="game-container" id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  
  <div class="ui-overlay">
    <div class="top-bar">
      <div class="level-info">
        <span>🌌</span> <span id="levelDisplay">1</span><span>/999</span>
      </div>
      <div class="gem-counter">
        <span>💎</span> <span id="gemDisplay">0</span>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="theme-indicator">
        <span class="theme-dot" id="themeDot" style="background: #b388ff; box-shadow:0 0 25px #b388ff;"></span>
        <span id="themeName">紫罗兰梦</span>
      </div>
    </div>
  </div>
  
  <div class="fullscreen-btn" id="fullscreenBtn" title="全屏沉浸">⛶</div>
  <div style="position:absolute; bottom:30px; left:30px; pointer-events:auto; z-index:20;">
    <button id="saveProgressBtn">💾 存档</button>
  </div>
  <div class="save-indicator" id="saveIndicator" style="opacity:0; transition: opacity 0.3s;">✔ 已保存</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    
    // UI元素
    const levelDisplay = document.getElementById('levelDisplay');
    const gemDisplay = document.getElementById('gemDisplay');
    const themeDot = document.getElementById('themeDot');
    const themeName = document.getElementById('themeName');
    const saveIndicator = document.getElementById('saveIndicator');
    
    // 游戏状态
    let currentLevel = 1;
    let gemsCollected = 0;
    let themeIndex = 0;
    const totalLevels = 999;
    
    // 五大色彩主题
    const themes = [
      { name: '紫罗兰梦', color: '#b388ff', particleBase: '#d1b3ff', gemColor: '#e0b0ff', bgHint: '#2a1a4a' },
      { name: '深海蓝调', color: '#4fc3f7', particleBase: '#81d4fa', gemColor: '#80deea', bgHint: '#0a1a2a' },
      { name: '玫瑰暮光', color: '#f8bbd0', particleBase: '#f48fb1', gemColor: '#ff80ab', bgHint: '#2a1520' },
      { name: '翡翠森林', color: '#81c784', particleBase: '#a5d6a7', gemColor: '#b9f6ca', bgHint: '#1a2a1a' },
      { name: '金色夕阳', color: '#ffb74d', particleBase: '#ffcc80', gemColor: '#ffd54f', bgHint: '#2a2010' }
    ];
    
    // 动态对象
    let meteors = [];
    let particles = [];
    let gems = [];
    
    // 鼠标/触摸位置
    let pointerX = 0, pointerY = 0;
    let pointerDown = false;
    
    // 音频上下文 (钢琴配乐模拟 - 使用振荡器生成柔和音符)
    let audioCtx = null;
    let musicGain = null;
    let isMusicPlaying = false;
    
    // 尺寸变量
    let width, height;
    
    // ----- 初始化音频 -----
    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = audioCtx.createGain();
        musicGain.gain.value = 0.12;
        musicGain.connect(audioCtx.destination);
      } catch (e) {
        console.log("音频不可用");
      }
    }
    
    // 播放一个柔和钢琴音 (基于频率)
    function playSoftPianoNote(freq, duration = 0.6, vol = 0.08) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(musicGain);
      osc.start(now);
      osc.stop(now + duration);
    }
    
    // 简单的随机钢琴旋律循环
    function startMelodyLoop() {
      if (!audioCtx || isMusicPlaying) return;
      isMusicPlaying = true;
      const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C大调
      function playNext() {
        if (!isMusicPlaying) return;
        const note = notes[Math.floor(Math.random() * notes.length)];
        playSoftPianoNote(note, 0.7, 0.07);
        const delay = 500 + Math.random() * 800;
        setTimeout(playNext, delay);
      }
      playNext();
    }
    
    function stopMelody() {
      isMusicPlaying = false;
    }
    
    // 播放收集宝石音效
    function playGemSound() {
      playSoftPianoNote(880, 0.2, 0.15);
      setTimeout(() => playSoftPianoNote(1100, 0.18, 0.12), 100);
    }
    
    // 播放陨石破碎音
    function playMeteorBreakSound() {
      playSoftPianoNote(180, 0.15, 0.1);
      setTimeout(() => playSoftPianoNote(150, 0.12, 0.08), 80);
    }
    
    // ----- 游戏逻辑 -----
    function resizeCanvas() {
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }
    
    // 根据当前主题获取颜色
    function getTheme() {
      return themes[themeIndex % themes.length];
    }
    
    // 生成陨石
    function spawnMeteor() {
      const theme = getTheme();
      const radius = 20 + Math.random() * 35;
      let x, y;
      // 从边缘出现
      if (Math.random() < 0.5) {
        x = Math.random() * width;
        y = -radius;
      } else {
        x = Math.random() * width;
        y = height + radius;
      }
      meteors.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.8,
        vy: (Math.random() * 1.2 + 0.5) * (y < height/2 ? 1 : -1),
        radius: radius,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.08,
        color: theme.color,
        health: 2 + Math.floor(Math.random() * 3),
      });
    }
    
    // 生成宝石 (从陨石掉落或随机)
    function spawnGem(x, y) {
      const theme = getTheme();
      gems.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() * -0.8 - 0.7),
        radius: 10 + Math.random() * 8,
        collected: false,
        color: theme.gemColor,
        sparkle: 0,
      });
    }
    
    // 处理点击/触摸释放粒子
    function handleInteraction(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;
      
      // 更新指针位置
      pointerX = canvasX;
      pointerY = canvasY;
      
      // 释放彩色粒子
      const theme = getTheme();
      const particleCount = 12 + Math.floor(Math.random() * 12);
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 7;
        particles.push({
          x: canvasX,
          y: canvasY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 5,
          life: 0.7 + Math.random() * 0.8,
          maxLife: 0.7 + Math.random() * 0.8,
          color: theme.particleBase,
        });
      }
      
      // 检查是否击中陨石
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        const dx = canvasX - m.x;
        const dy = canvasY - m.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < m.radius + 15) { // 触摸范围
          m.health--;
          playMeteorBreakSound();
          // 产生额外破碎粒子
          for (let j = 0; j < 8; j++) {
            particles.push({
              x: m.x, y: m.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              radius: 2 + Math.random() * 4,
              life: 0.5,
              maxLife: 0.5,
              color: theme.color,
            });
          }
          if (m.health <= 0) {
            // 陨石破碎，掉落宝石
            spawnGem(m.x, m.y);
            meteors.splice(i, 1);
          }
          break; // 一次点击只摧毁一个陨石 (更解压)
        }
      }
    }
    
    // 事件监听
    function onPointerDown(e) {
      e.preventDefault();
      pointerDown = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      handleInteraction(clientX, clientY);
      
      // 初始化音频上下文 (需用户手势)
      if (!audioCtx) {
        initAudio();
        startMelodyLoop();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        if (!isMusicPlaying) startMelodyLoop();
      }
    }
    
    function onPointerMove(e) {
      if (!pointerDown) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      // 移动时也释放粒子，增强解压感
      handleInteraction(clientX, clientY);
    }
    
    function onPointerUp(e) {
      e.preventDefault();
      pointerDown = false;
    }
    
    // 更新逻辑
    function update() {
      // 粒子更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.012;
        if (p.life <= 0 || p.x < -20 || p.x > width+20 || p.y < -20 || p.y > height+20) {
          particles.splice(i,1);
        }
      }
      
      // 陨石更新
      for (let m of meteors) {
        m.x += m.vx;
        m.y += m.vy;
        m.rotation += m.rotSpeed;
        // 边界反弹
        if (m.x - m.radius < 0) { m.x = m.radius; m.vx *= -0.9; }
        if (m.x + m.radius > width) { m.x = width - m.radius; m.vx *= -0.9; }
        if (m.y - m.radius < 0) { m.y = m.radius; m.vy *= -0.9; }
        if (m.y + m.radius > height) { m.y = height - m.radius; m.vy *= -0.9; }
      }
      
      // 宝石更新
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.x += g.vx;
        g.y += g.vy;
        g.vy += 0.06; // 轻微重力
        g.sparkle += 0.1;
        // 边界移除
        if (g.y > height + 30 || g.x < -30 || g.x > width+30) {
          gems.splice(i,1);
          continue;
        }
        // 检测与指针碰撞收集 (自动吸附)
        const dx = pointerX - g.x;
        const dy = pointerY - g.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 50 && pointerDown) {
          // 收集宝石
          gemsCollected++;
          playGemSound();
          gems.splice(i,1);
          updateUI();
          // 每收集5颗宝石提升关卡
          if (gemsCollected % 5 === 0 && currentLevel < totalLevels) {
            currentLevel++;
            themeIndex = (currentLevel - 1) % themes.length;
            updateUI();
            // 关卡提升时增加陨石数量
            if (meteors.length < 4 + Math.floor(currentLevel/3)) {
              spawnMeteor();
            }
          }
        }
      }
      
      // 保持陨石数量
      const targetMeteorCount = Math.min(3 + Math.floor(currentLevel / 5), 8);
      while (meteors.length < targetMeteorCount) {
        spawnMeteor();
      }
      
      // 缓慢自动生成宝石 (偶尔)
      if (Math.random() < 0.002 && gems.length < 6) {
        spawnGem(Math.random() * width, -10);
      }
    }
    
    function updateUI() {
      levelDisplay.textContent = currentLevel;
      gemDisplay.textContent = gemsCollected;
      const theme = getTheme();
      themeDot.style.background = theme.color;
      themeDot.style.boxShadow = `0 0 25px ${theme.color}`;
      themeName.textContent = theme.name;
    }
    
    // 绘制图形
    function draw() {
      ctx.clearRect(0, 0, width, height);
      const theme = getTheme();
      
      // 梦幻背景渐变
      const grad = ctx.createLinearGradient(0, 0, width*0.6, height);
      grad.addColorStop(0, theme.bgHint);
      grad.addColorStop(0.7, '#0a0c18');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      
      // 绘制星星背景
      ctx.fillStyle = 'rgba(255,255,200,0.15)';
      for (let i=0;i<40;i++) {
        let sx = (i*23 + Date.now()*0.01)%width;
        let sy = (i*17)%height;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.2, 0, Math.PI*2);
        ctx.fill();
      }
      
      // 绘制粒子
      for (let p of particles) {
        ctx.globalAlpha = p.life * 0.9;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
        ctx.fill();
      }
      
      // 绘制陨石
      for (let m of meteors) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rotation);
        ctx.shadowColor = m.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = m.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        // 不规则陨石形状
        ctx.beginPath();
        for (let i=0; i<7; i++) {
          let angle = (i/7)*Math.PI*2;
          let r = m.radius * (0.75 + Math.sin(i*4.5)*0.2);
          let x = Math.cos(angle)*r;
          let y = Math.sin(angle)*r;
          if (i===0) ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 生命值指示
        if (m.health > 1) {
          ctx.fillStyle = 'white';
          ctx.font = 'bold 14px "Quicksand"';
          ctx.shadowBlur = 8;
          ctx.fillText('●'.repeat(m.health-1), -8, 4);
        }
        ctx.restore();
      }
      
      // 绘制宝石
      for (let g of gems) {
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 18;
        // 闪耀效果
        let sparkle = Math.sin(g.sparkle)*0.3 + 0.7;
        ctx.fillStyle = g.color;
        ctx.beginPath();
        // 钻石形状
        ctx.moveTo(0, -g.radius);
        ctx.lineTo(g.radius*0.7, 0);
        ctx.lineTo(0, g.radius*0.9);
        ctx.lineTo(-g.radius*0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(0, -g.radius*0.3, g.radius*0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
    
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    // 存档功能
    function saveProgress() {
      const gameState = {
        level: currentLevel,
        gems: gemsCollected,
        themeIdx: themeIndex,
      };
      localStorage.setItem('stardustRelaxGame', JSON.stringify(gameState));
      saveIndicator.style.opacity = '1';
      setTimeout(() => { saveIndicator.style.opacity = '0'; }, 1500);
    }
    
    function loadProgress() {
      const saved = localStorage.getItem('stardustRelaxGame');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          currentLevel = data.level || 1;
          gemsCollected = data.gems || 0;
          themeIndex = data.themeIdx || 0;
          updateUI();
        } catch(e) {}
      }
    }
    
    // 全屏切换
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    }
    
    // 事件绑定
    function bindEvents() {
      canvas.addEventListener('touchstart', onPointerDown, {passive: false});
      canvas.addEventListener('touchmove', onPointerMove, {passive: false});
      canvas.addEventListener('touchend', onPointerUp);
      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', (e) => {
        if (pointerDown) onPointerMove(e);
        // 更新指针位置用于宝石吸附
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        pointerX = (e.clientX - rect.left) * scaleX;
        pointerY = (e.clientY - rect.top) * scaleY;
      });
      window.addEventListener('mouseup', onPointerUp);
      
      document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
      document.getElementById('saveProgressBtn').addEventListener('click', saveProgress);
      window.addEventListener('resize', resizeCanvas);
    }
    
    // 启动一切
    function startGame() {
      resizeCanvas();
      loadProgress();
      updateUI();
      bindEvents();
      // 初始生成一些陨石
      for (let i=0; i<4; i++) spawnMeteor();
      gameLoop();
    }
    
    startGame();
  })();
</script>
</body>
</html>
