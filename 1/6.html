<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏃 霓虹跑酷 · Neon Runner</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #060b18;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            touch-action: manipulation;
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }

        .ui-layer>* {
            pointer-events: auto;
        }

        .top-bar {
            position: absolute;
            top: calc(12px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            background: rgba(12, 18, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .score-item .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8899cc;
        }
        .score-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffd740;
            text-shadow: 0 0 15px rgba(255, 215, 64, 0.6);
            min-width: 40px;
            text-align: center;
        }
        .high-score-value {
            font-size: 0.8rem;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-left: 8px;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background: rgba(20, 28, 50, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            color: #fff;
            font-size: 1.1rem;
        }
        .icon-btn:active {
            transform: scale(0.88);
            border-color: #fff;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.4);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #ddd;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint-text {
            position: absolute;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
        <div class="top-bar">
            <div class="score-item">
                <span class="label">得分</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
            <div class="score-item">
                <span class="label">最高</span>
                <span class="high-score-value" id="highScoreDisplay">0</span>
            </div>
            <div class="btn-group">
                <button class="icon-btn" id="btnFullscreen" title="全屏模式" aria-label="全屏切换">
                    <svg id="fullscreenIcon" viewBox="0 0 24 24">
                        <polyline points="8 3 3 3 3 8"></polyline>
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <polyline points="3 16 3 21 8 21"></polyline>
                    </svg>
                </button>
                <button class="icon-btn" id="btnSound" title="音效开关">
                    <span id="soundIcon">🔊</span>
                </button>
            </div>
        </div>
        <div class="hint-text">点击屏幕跳跃 · 支持二段跳</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            const btnFullscreen = document.getElementById('btnFullscreen');
            const btnSound = document.getElementById('btnSound');
            const soundIcon = document.getElementById('soundIcon');
            const fullscreenIcon = document.getElementById('fullscreenIcon');

            let W, H;

            function resizeCanvas() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W;
                canvas.height = H;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => {
                setTimeout(resizeCanvas, 100);
            });

            // 音效引擎
            let audioCtx = null;
            let soundEnabled = true;
            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {
                        soundEnabled = false;
                        updateSoundIcon();
                        return;
                    }
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            function playTone(freq, type, dur, vol = 0.06, glide = null) {
                if (!soundEnabled || !audioCtx) return;
                try {
                    const t = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (glide) osc.frequency.linearRampToValueAtTime(glide, t + dur);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + dur);
                } catch (e) {}
            }
            function sfxJump() { playTone(300, 'sine', 0.08, 0.05, 700); }
            function sfxDoubleJump() { playTone(450, 'sine', 0.06, 0.06, 1000);
                playTone(700, 'triangle', 0.04, 0.08); }
            function sfxCoin() { playTone(900, 'sine', 0.05, 0.07);
                playTone(1300, 'sine', 0.03, 0.09, 1700); }
            function sfxHit() { playTone(35, 'sawtooth', 0.2, 0.4, 18);
                playTone(55, 'square', 0.12, 0.35); }
            function sfxGameOver() { playTone(20, 'sawtooth', 0.3, 0.8, 10); }
            function updateSoundIcon() { soundIcon.textContent = soundEnabled ? '🔊' : '🔇'; }

            // 游戏状态
            let gameState = 'waiting';
            let score = 0;
            let highScore = 0;
            let gameSpeed = 0;
            const BASE_SPEED = 5.5;
            let frameCount = 0;
            let groundScroll = 0;

            const player = {
                x: 0,
                y: 0,
                w: 30,
                h: 36,
                vy: 0,
                jumpsLeft: 2,
                maxJumps: 2,
                onGround: true,
                trail: [],
                glowPhase: 0,
                invincible: 0,
            };
            const GRAVITY = 0.75;
            const JUMP_FORCE = -14;
            const GROUND_Y_RATIO = 0.78;

            function getGroundY() { return Math.floor(H * GROUND_Y_RATIO); }
            function initPlayer() {
                player.x = W * 0.15;
                player.y = getGroundY() - player.h;
                player.vy = 0;
                player.jumpsLeft = player.maxJumps;
                player.onGround = true;
                player.trail = [];
                player.invincible = 0;
                player.glowPhase = 0;
            }

            let obstacles = [];
            const OBSTACLE_TYPES = ['spike', 'pillar', 'double'];

            function spawnObstacle() {
                const groundY = getGroundY();
                const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
                let w, h;
                switch (type) {
                    case 'spike':
                        w = 20 + Math.random() * 16;
                        h = 30 + Math.random() * 35;
                        break;
                    case 'pillar':
                        w = 24 + Math.random() * 18;
                        h = 55 + Math.random() * 45;
                        break;
                    case 'double':
                        w = 18 + Math.random() * 12;
                        h = 24 + Math.random() * 18;
                        break;
                    default:
                        w = 22;
                        h = 38;
                }
                obstacles.push({
                    x: W + 30,
                    y: groundY - h,
                    w,
                    h,
                    type,
                    passed: false,
                });
            }

            let coins = [];
            function spawnCoin() {
                const groundY = getGroundY();
                const cy = groundY - 55 - Math.random() * 90;
                coins.push({
                    x: W + 40,
                    y: Math.max(35, cy),
                    r: 10,
                    collected: false,
                    pulsePhase: Math.random() * Math.PI * 2,
                });
            }

            let particles = [];
            function spawnParticles(x, y, color, count = 14) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 7 + 2;
                    particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - Math.random() * 3,
                        life: 1,
                        decay: 0.018 + Math.random() * 0.04,
                        color,
                        r: Math.random() * 3 + 1,
                    });
                }
            }

            function resetGame() {
                score = 0;
                gameSpeed = BASE_SPEED;
                frameCount = 0;
                groundScroll = 0;
                obstacles = [];
                coins = [];
                particles = [];
                initPlayer();
                gameState = 'waiting';
                updateScoreDisplay();
            }

            function updateScoreDisplay() {
                scoreDisplay.textContent = Math.floor(score);
                if (score > highScore) {
                    highScore = Math.floor(score);
                    try { localStorage.setItem('neonRunnerHighScoreV2', highScore); } catch (e) {}
                }
                highScoreDisplay.textContent = highScore;
            }

            function jump() {
                initAudio();
                if (gameState === 'gameover') {
                    resetGame();
                    gameState = 'waiting';
                    return;
                }
                if (gameState === 'waiting') {
                    gameState = 'playing';
                    player.vy = JUMP_FORCE;
                    player.jumpsLeft = player.maxJumps - 1;
                    player.onGround = false;
                    sfxJump();
                    spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 10);
                    return;
                }
                if (player.jumpsLeft > 0) {
                    player.vy = JUMP_FORCE * (player.jumpsLeft === player.maxJumps ? 1 : 0.85);
                    if (player.jumpsLeft === 1) {
                        sfxDoubleJump();
                        spawnParticles(player.x + player.w / 2, player.y + player.h, '#00e5ff', 16);
                    } else {
                        sfxJump();
                        spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 10);
                    }
                    player.jumpsLeft--;
                    player.onGround = false;
                }
            }

            function update() {
                frameCount++;
                if (gameState !== 'playing') {
                    for (let p of particles) { p.x += p.vx;
                        p.y += p.vy;
                        p.life -= p.decay;
                        p.vy += 0.03; }
                    particles = particles.filter(p => p.life > 0);
                    player.glowPhase += 0.04;
                    player.trail.push({ x: player.x + player.w / 2, y: player.y + player.h / 2, life: 1 });
                    if (player.trail.length > 9) player.trail.shift();
                    for (let t of player.trail) t.life -= 0.06;
                    player.trail = player.trail.filter(t => t.life > 0);
                    return;
                }

                gameSpeed = BASE_SPEED + Math.floor(score / 200) * 0.7;
                if (gameSpeed > 15) gameSpeed = 15;
                score += gameSpeed * 0.16;
                groundScroll = (groundScroll + gameSpeed) % 50;

                const groundY = getGroundY();
                player.vy += GRAVITY;
                player.y += player.vy;
                if (player.y + player.h >= groundY) {
                    player.y = groundY - player.h;
                    player.vy = 0;
                    player.jumpsLeft = player.maxJumps;
                    player.onGround = true;
                }
                player.glowPhase += 0.06;
                if (player.invincible > 0) player.invincible--;

                player.trail.push({ x: player.x + player.w / 2, y: player.y + player.h / 2, life: 1 });
                if (player.trail.length > 11) player.trail.shift();
                for (let t of player.trail) t.life -= 0.05;
                player.trail = player.trail.filter(t => t.life > 0);

                const spawnInterval = Math.max(35, 85 - Math.floor(score / 150) * 5);
                if (frameCount % spawnInterval === 0 && Math.random() < 0.7) spawnObstacle();
                if (Math.random() < 0.02 && coins.length < 3) spawnCoin();

                for (let ob of obstacles) {
                    ob.x -= gameSpeed;
                    if (!ob.passed && ob.x + ob.w < player.x) {
                        ob.passed = true;
                        score += 5;
                    }
                }
                obstacles = obstacles.filter(ob => ob.x > -100);

                for (let c of coins) {
                    c.x -= gameSpeed;
                    c.pulsePhase += 0.06;
                }
                coins = coins.filter(c => c.x > -50 && !c.collected);

                if (player.invincible <= 0) {
                    for (let ob of obstacles) {
                        const px = player.x + 5;
                        const py = player.y + 5;
                        const pw = player.w - 10;
                        const ph = player.h - 10;
                        if (px < ob.x + ob.w && px + pw > ob.x && py < ob.y + ob.h && py + ph > ob.y) {
                            sfxHit();
                            sfxGameOver();
                            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff2d78', 45);
                            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 30);
                            gameState = 'gameover';
                            updateScoreDisplay();
                            return;
                        }
                    }
                }

                for (let c of coins) {
                    if (c.collected) continue;
                    const dx = (player.x + player.w / 2) - c.x;
                    const dy = (player.y + player.h / 2) - c.y;
                    if (Math.sqrt(dx * dx + dy * dy) < player.w / 2 + c.r) {
                        c.collected = true;
                        score += 30;
                        sfxCoin();
                        spawnParticles(c.x, c.y, '#ffd740', 18);
                    }
                }
                coins = coins.filter(c => !c.collected || c.x > -50);

                for (let p of particles) { p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    p.vy += 0.03; }
                particles = particles.filter(p => p.life > 0);

                updateScoreDisplay();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                const groundY = getGroundY();

                const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
                skyGrad.addColorStop(0, '#04091a');
                skyGrad.addColorStop(0.5, '#0b1430');
                skyGrad.addColorStop(1, '#121e40');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);

                for (let i = 0; i < 60; i++) {
                    const sx = ((i * 173 + 41) % W);
                    const sy = ((i * 251 + 13) % (groundY - 15)) + 8;
                    const sr = ((i * 37) % 3) * 0.35 + 0.5;
                    const twinkle = 0.4 + Math.sin(frameCount * 0.03 + i * 2.1) * 0.4;
                    ctx.globalAlpha = twinkle;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                const buildingsFar = [
                    { x: 0, w: 60, h: 110 }, { x: 70, w: 40, h: 150 }, { x: 120, w: 65, h: 95 },
                    { x: 195, w: 45, h: 170 }, { x: 250, w: 70, h: 120 }, { x: 330, w: 35, h: 140 },
                    { x: 375, w: 55, h: 160 }, { x: 440, w: 50, h: 105 }, { x: 500, w: 65, h: 180 },
                ];
                ctx.fillStyle = 'rgba(14,20,48,0.9)';
                for (const b of buildingsFar) {
                    const bx = (b.x - groundScroll * 0.3) % (W + 120) - 60;
                    ctx.fillRect(bx, groundY - b.h, b.w, b.h);
                }

                const buildingsNear = [
                    { x: 0, w: 80, h: 190 }, { x: 95, w: 55, h: 240 }, { x: 165, w: 70, h: 170 },
                    { x: 250, w: 50, h: 260 }, { x: 315, w: 75, h: 200 }, { x: 405, w: 60, h: 230 },
                ];
                ctx.fillStyle = 'rgba(8,12,32,0.95)';
                for (const b of buildingsNear) {
                    const bx = (b.x - groundScroll * 0.6) % (W + 140) - 70;
                    ctx.fillRect(bx, groundY - b.h, b.w, b.h);
                }

                ctx.fillStyle = '#ffd740';
                for (const b of buildingsNear) {
                    const bx = (b.x - groundScroll * 0.6) % (W + 140) - 70;
                    for (let wy = groundY - b.h + 18; wy < groundY - 25; wy += 28) {
                        for (let wx = bx + 10; wx < bx + b.w - 12; wx += 20) {
                            if (Math.random() < 0.5) {
                                ctx.globalAlpha = 0.45 + Math.random() * 0.55;
                                ctx.fillRect(wx, wy, 8, 10);
                            }
                        }
                    }
                }
                ctx.globalAlpha = 1;

                const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
                groundGrad.addColorStop(0, '#1a2850');
                groundGrad.addColorStop(1, '#0a1030');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, groundY, W, H - groundY);

                ctx.strokeStyle = 'rgba(0,229,255,0.5)';
                ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(0,229,255,0.7)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(W, groundY);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(0,229,255,0.4)';
                for (let i = 0; i < W / 35 + 2; i++) {
                    const mx = (i * 35 - groundScroll % 35 + W) % W;
                    if (mx < W) ctx.fillRect(mx, groundY + 4, 14, 3);
                }

                for (const c of coins) {
                    if (c.collected) continue;
                    const glowR = c.r + 5 + Math.sin(c.pulsePhase) * 3;
                    const glow = ctx.createRadialGradient(c.x, c.y, c.r * 0.3, c.x, c.y, glowR);
                    glow.addColorStop(0, 'rgba(255,215,64,0.95)');
                    glow.addColorStop(0.5, 'rgba(255,180,40,0.4)');
                    glow.addColorStop(1, 'rgba(255,150,20,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, glowR, 0, Math.PI * 2);
                    ctx.fill();
                    const coinGrad = ctx.createRadialGradient(c.x - c.r * 0.2, c.y - c.r * 0.2, c.r * 0.1, c.x, c.y, c.r);
                    coinGrad.addColorStop(0, '#fffde0');
                    coinGrad.addColorStop(0.5, '#ffd740');
                    coinGrad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = coinGrad;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(c.x - c.r * 0.25, c.y - c.r * 0.3, c.r * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (const ob of obstacles) {
                    const grad = ctx.createLinearGradient(ob.x, ob.y, ob.x, ob.y + ob.h);
                    grad.addColorStop(0, '#ff3d60');
                    grad.addColorStop(0.5, '#e02040');
                    grad.addColorStop(1, '#6b0020');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(255,45,120,0.6)';
                    ctx.shadowBlur = 14;
                    if (ob.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(ob.x + ob.w / 2, ob.y);
                        ctx.lineTo(ob.x, ob.y + ob.h);
                        ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
                        ctx.closePath();
                        ctx.fill();
                    } else if (ob.type === 'pillar') {
                        ctx.beginPath();
                        ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 6);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.roundRect(ob.x + ob.w + 4, ob.y + ob.h * 0.3, ob.w * 0.7, ob.h * 0.5, 3);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,150,180,0.6)';
                    ctx.lineWidth = 1.5;
                    if (ob.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(ob.x + ob.w / 2, ob.y);
                        ctx.lineTo(ob.x, ob.y + ob.h);
                        ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
                        ctx.closePath();
                        ctx.stroke();
                    } else if (ob.type === 'pillar') {
                        ctx.beginPath();
                        ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 6);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
                        ctx.stroke();
                    }
                }

                for (let i = 0; i < player.trail.length; i++) {
                    const t = player.trail[i];
                    const alpha = t.life * 0.55;
                    const r = 7 * t.life;
                    ctx.fillStyle = `rgba(0,229,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (player.invincible > 0 && player.invincible % 6 < 3) ctx.globalAlpha = 0.4;
                const px = player.x,
                    py = player.y,
                    pw = player.w,
                    ph = player.h;
                const playerGlow = ctx.createRadialGradient(px + pw / 2, py + ph / 2, pw * 0.3, px + pw / 2, py + ph / 2, pw *
                    1.2);
                playerGlow.addColorStop(0, 'rgba(0,229,255,0.8)');
                playerGlow.addColorStop(0.5, 'rgba(0,180,255,0.3)');
                playerGlow.addColorStop(1, 'rgba(0,100,200,0)');
                ctx.fillStyle = playerGlow;
                ctx.beginPath();
                ctx.roundRect(px - 8, py - 8, pw + 16, ph + 16, 10);
                ctx.fill();
                const bodyGrad = ctx.createLinearGradient(px, py, px, py + ph);
                bodyGrad.addColorStop(0, '#00e5ff');
                bodyGrad.addColorStop(0.4, '#00b8d4');
                bodyGrad.addColorStop(1, '#0050a0');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(px, py, pw, ph, 7);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillRect(px + pw * 0.2, py + 5, pw * 0.35, ph * 0.22);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(px + pw * 0.55, py + ph * 0.3, pw * 0.2, ph * 0.15);
                ctx.globalAlpha = 1;

                for (const p of particles) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                if (gameState === 'waiting') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${Math.floor(W*0.055)}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('点击屏幕开始奔跑', W / 2, H / 2 - 10);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = `${Math.floor(W*0.03)}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.fillText('点击跳跃 · 支持二段跳', W / 2, H / 2 + 30);
                }

                if (gameState === 'gameover') {
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#ff2d78';
                    ctx.font = `bold ${Math.floor(W*0.065)}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏结束', W / 2, H / 2 - 20);
                    ctx.fillStyle = '#fff';
                    ctx.font = `${Math.floor(W*0.04)}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.fillText('得分: ' + Math.floor(score), W / 2, H / 2 + 25);
                    ctx.fillStyle = '#ffd740';
                    ctx.font = `${Math.floor(W*0.035)}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.fillText('点击屏幕重新开始', W / 2, H / 2 + 55);
                }
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            canvas.addEventListener('click', e => { e.preventDefault();
                jump(); });
            canvas.addEventListener('touchstart', e => { e.preventDefault();
                jump(); }, { passive: false });

            window.addEventListener('keydown', e => {
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault();
                    jump(); }
                if (e.code === 'KeyF') { e.preventDefault();
                    toggleFullscreen(); }
                if (e.code === 'KeyM') { e.preventDefault();
                    btnSound.click(); }
            });

            function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

            function requestFullscreen() {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            }

            function exitFullscreen() {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }

            function toggleFullscreen() {
                initAudio();
                if (isFullscreen()) exitFullscreen();
                else requestFullscreen();
            }

            function updateFullscreenIconUI() {
                const full = isFullscreen();
                if (full) {
                    fullscreenIcon.innerHTML =
                        '<polyline points="4 8 8 4 4 4 4 8"></polyline><polyline points="20 8 16 4 20 4 20 8"></polyline><polyline points="20 16 16 20 20 20 20 16"></polyline><polyline points="4 16 8 20 4 20 4 16"></polyline>';
                } else {
                    fullscreenIcon.innerHTML =
                        '<polyline points="8 3 3 3 3 8"></polyline><polyline points="16 3 21 3 21 8"></polyline><polyline points="21 16 21 21 16 21"></polyline><polyline points="3 16 3 21 8 21"></polyline>';
                }
            }

            btnFullscreen.addEventListener('click', e => { e.stopPropagation();
                toggleFullscreen(); });
            document.addEventListener('fullscreenchange', () => { updateFullscreenIconUI();
                setTimeout(resizeCanvas, 200); });
            document.addEventListener('webkitfullscreenchange', () => { updateFullscreenIconUI();
                setTimeout(resizeCanvas, 200); });
            updateFullscreenIconUI();

            btnSound.addEventListener('click', e => {
                e.stopPropagation();
                initAudio();
                soundEnabled = !soundEnabled;
                updateSoundIcon();
                if (soundEnabled && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            });

            function init() {
                resizeCanvas();
                try { const saved = localStorage.getItem('neonRunnerHighScoreV2'); if (saved) highScore = parseInt(
                        saved) || 0; } catch (e) { highScore = 0; }
                resetGame();
                updateScoreDisplay();
                updateSoundIcon();
                updateFullscreenIconUI();
            }
            init();
            gameLoop();

            console.log('🏃 霓虹跑酷 · 全屏自适应已就绪');
        })();
    </script>
</body>
</html>
