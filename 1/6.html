<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🏃 霓虹跑酷</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
            -webkit-overflow-scrolling: none;
        }
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
            touch-action: manipulation;
            cursor: pointer;
        }
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }
        .ui-layer>* {
            pointer-events: auto;
        }
        .top-panel {
            position: absolute;
            top: calc(10px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(10, 16, 34, 0.8);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.7);
            z-index: 20;
            white-space: nowrap;
        }
        .score-block {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .score-block .s-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #8899cc;
            letter-spacing: 1.5px;
        }
        .score-block .s-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffd740;
            text-shadow: 0 0 12px rgba(255, 215, 64, 0.7);
            min-width: 32px;
            text-align: center;
        }
        .score-block .s-best {
            font-size: 0.7rem;
            color: #00e5ff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
            font-weight: 700;
        }
        .btn-set {
            display: flex;
            gap: 6px;
            margin-left: 6px;
        }
        .circle-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            background: rgba(18, 26, 48, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
            outline: none;
            color: #fff;
            font-size: 1rem;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 30;
        }
        .circle-btn:active {
            transform: scale(0.85);
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.45);
        }
        .circle-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #ddd;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }
        .bottom-tip {
            position: absolute;
            bottom: calc(20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
        <div class="top-panel">
            <div class="score-block">
                <span class="s-label">得分</span>
                <span class="s-val" id="scoreDisplay">0</span>
            </div>
            <div class="score-block">
                <span class="s-label">最佳</span>
                <span class="s-best" id="highScoreDisplay">0</span>
            </div>
            <div class="btn-set">
                <button class="circle-btn" id="btnFullscreen" title="全屏" aria-label="全屏切换">
                    <svg id="fullscreenIcon" viewBox="0 0 24 24">
                        <polyline points="8 3 3 3 3 8"></polyline>
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <polyline points="3 16 3 21 8 21"></polyline>
                    </svg>
                </button>
                <button class="circle-btn" id="btnSound" title="音效">
                    <span id="soundIcon" style="font-size:0.9rem;">🔊</span>
                </button>
            </div>
        </div>
        <div class="bottom-tip">点击跳跃 · 支持二段跳</div>
    </div>

    <script>
        (function() {
            // ==================== DOM ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            const btnFullscreen = document.getElementById('btnFullscreen');
            const btnSound = document.getElementById('btnSound');
            const soundIcon = document.getElementById('soundIcon');
            const fullscreenIcon = document.getElementById('fullscreenIcon');

            // ==================== 画布尺寸 ====================
            let W, H;
            function resizeCanvas() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W;
                canvas.height = H;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', function() {
                setTimeout(resizeCanvas, 150);
            });

            // ==================== 音效 ====================
            let audioCtx = null;
            let soundEnabled = true;
            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {
                        soundEnabled = false;
                        updateSoundIcon();
                        return;
                    }
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(function() {});
                }
            }
            function playTone(freq, type, dur, vol, glide) {
                if (!soundEnabled || !audioCtx) return;
                vol = vol || 0.06;
                try {
                    var t = audioCtx.currentTime;
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.setValueAtTime(freq, t);
                    if (glide) osc.frequency.linearRampToValueAtTime(glide, t + dur);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + dur);
                } catch (e) {}
            }
            function sfxJump() { playTone(300, 'sine', 0.08, 0.05, 700); }
            function sfxDoubleJump() { playTone(450, 'sine', 0.06, 0.06, 1000);
                playTone(700, 'triangle', 0.04, 0.08); }
            function sfxCoin() { playTone(900, 'sine', 0.05, 0.07);
                playTone(1300, 'sine', 0.03, 0.09, 1700); }
            function sfxHit() { playTone(35, 'sawtooth', 0.2, 0.4, 18);
                playTone(55, 'square', 0.12, 0.35); }
            function sfxGameOver() { playTone(20, 'sawtooth', 0.3, 0.8, 10); }
            function updateSoundIcon() { soundIcon.textContent = soundEnabled ? '🔊' : '🔇'; }

            // ==================== 游戏状态 ====================
            var gameState = 'waiting';
            var score = 0;
            var highScore = 0;
            var gameSpeed = 0;
            var BASE_SPEED = 5.5;
            var frameCount = 0;
            var groundScroll = 0;

            var player = {
                x: 0,
                y: 0,
                w: 30,
                h: 36,
                vy: 0,
                jumpsLeft: 2,
                maxJumps: 2,
                onGround: true,
                trail: [],
                glowPhase: 0,
                invincible: 0,
            };
            var GRAVITY = 0.75;
            var JUMP_FORCE = -14;
            var GROUND_Y_RATIO = 0.78;

            function getGroundY() { return Math.floor(H * GROUND_Y_RATIO); }
            function initPlayer() {
                player.x = W * 0.15;
                player.y = getGroundY() - player.h;
                player.vy = 0;
                player.jumpsLeft = player.maxJumps;
                player.onGround = true;
                player.trail = [];
                player.invincible = 0;
                player.glowPhase = 0;
            }

            var obstacles = [];
            var OBSTACLE_TYPES = ['spike', 'pillar', 'double'];

            function spawnObstacle() {
                var groundY = getGroundY();
                var type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
                var w, h;
                if (type === 'spike') { w = 20 + Math.random() * 16;
                    h = 30 + Math.random() * 35; } else if (type === 'pillar') { w = 24 + Math.random() * 18;
                    h = 55 + Math.random() * 45; } else { w = 18 + Math.random() * 12;
                    h = 24 + Math.random() * 18; }
                obstacles.push({ x: W + 30, y: groundY - h, w: w, h: h, type: type, passed: false });
            }

            var coins = [];
            function spawnCoin() {
                var groundY = getGroundY();
                var cy = groundY - 55 - Math.random() * 90;
                coins.push({ x: W + 40, y: Math.max(35, cy), r: 10, collected: false, pulsePhase: Math.random() * Math.PI *
                        2 });
            }

            var particles = [];
            function spawnParticles(x, y, color, count) {
                count = count || 14;
                for (var i = 0; i < count; i++) {
                    var angle = Math.random() * Math.PI * 2;
                    var speed = Math.random() * 7 + 2;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - Math.random() * 3,
                        life: 1,
                        decay: 0.018 + Math.random() * 0.04,
                        color: color,
                        r: Math.random() * 3 + 1,
                    });
                }
            }

            function resetGame() {
                score = 0;
                gameSpeed = BASE_SPEED;
                frameCount = 0;
                groundScroll = 0;
                obstacles = [];
                coins = [];
                particles = [];
                initPlayer();
                gameState = 'waiting';
                updateScoreDisplay();
            }

            function updateScoreDisplay() {
                scoreDisplay.textContent = Math.floor(score);
                if (score > highScore) {
                    highScore = Math.floor(score);
                    try { localStorage.setItem('neonRunnerHS', highScore); } catch (e) {}
                }
                highScoreDisplay.textContent = highScore;
            }

            function jump() {
                initAudio();
                if (gameState === 'gameover') {
                    resetGame();
                    gameState = 'waiting';
                    return;
                }
                if (gameState === 'waiting') {
                    gameState = 'playing';
                    player.vy = JUMP_FORCE;
                    player.jumpsLeft = player.maxJumps - 1;
                    player.onGround = false;
                    sfxJump();
                    spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 10);
                    return;
                }
                if (player.jumpsLeft > 0) {
                    player.vy = JUMP_FORCE * (player.jumpsLeft === player.maxJumps ? 1 : 0.85);
                    if (player.jumpsLeft === 1) {
                        sfxDoubleJump();
                        spawnParticles(player.x + player.w / 2, player.y + player.h, '#00e5ff', 16);
                    } else {
                        sfxJump();
                        spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 10);
                    }
                    player.jumpsLeft--;
                    player.onGround = false;
                }
            }

            function update() {
                frameCount++;
                if (gameState !== 'playing') {
                    for (var i = particles.length - 1; i >= 0; i--) {
                        var p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= p.decay;
                        p.vy += 0.03;
                        if (p.life <= 0) particles.splice(i, 1);
                    }
                    player.glowPhase += 0.04;
                    player.trail.push({ x: player.x + player.w / 2, y: player.y + player.h / 2, life: 1 });
                    if (player.trail.length > 9) player.trail.shift();
                    for (var j = player.trail.length - 1; j >= 0; j--) {
                        player.trail[j].life -= 0.06;
                        if (player.trail[j].life <= 0) player.trail.splice(j, 1);
                    }
                    return;
                }

                gameSpeed = BASE_SPEED + Math.floor(score / 200) * 0.7;
                if (gameSpeed > 15) gameSpeed = 15;
                score += gameSpeed * 0.16;
                groundScroll = (groundScroll + gameSpeed) % 50;

                var groundY = getGroundY();
                player.vy += GRAVITY;
                player.y += player.vy;
                if (player.y + player.h >= groundY) {
                    player.y = groundY - player.h;
                    player.vy = 0;
                    player.jumpsLeft = player.maxJumps;
                    player.onGround = true;
                }
                player.glowPhase += 0.06;
                if (player.invincible > 0) player.invincible--;

                player.trail.push({ x: player.x + player.w / 2, y: player.y + player.h / 2, life: 1 });
                if (player.trail.length > 11) player.trail.shift();
                for (var k = player.trail.length - 1; k >= 0; k--) {
                    player.trail[k].life -= 0.05;
                    if (player.trail[k].life <= 0) player.trail.splice(k, 1);
                }

                var spawnInterval = Math.max(35, 85 - Math.floor(score / 150) * 5);
                if (frameCount % spawnInterval === 0 && Math.random() < 0.7) spawnObstacle();
                if (Math.random() < 0.02 && coins.length < 3) spawnCoin();

                for (var oi = obstacles.length - 1; oi >= 0; oi--) {
                    var ob = obstacles[oi];
                    ob.x -= gameSpeed;
                    if (!ob.passed && ob.x + ob.w < player.x) { ob.passed = true;
                        score += 5; }
                    if (ob.x < -100) obstacles.splice(oi, 1);
                }

                for (var ci = coins.length - 1; ci >= 0; ci--) {
                    var c = coins[ci];
                    c.x -= gameSpeed;
                    c.pulsePhase += 0.06;
                    if (c.x < -50 && !c.collected) coins.splice(ci, 1);
                }

                if (player.invincible <= 0) {
                    for (var oi2 = obstacles.length - 1; oi2 >= 0; oi2--) {
                        var ob2 = obstacles[oi2];
                        var px = player.x + 5;
                        var py = player.y + 5;
                        var pw = player.w - 10;
                        var ph = player.h - 10;
                        if (px < ob2.x + ob2.w && px + pw > ob2.x && py < ob2.y + ob2.h && py + ph > ob2.y) {
                            sfxHit();
                            sfxGameOver();
                            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff2d78', 45);
                            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 30);
                            gameState = 'gameover';
                            updateScoreDisplay();
                            return;
                        }
                    }
                }

                for (var ci2 = coins.length - 1; ci2 >= 0; ci2--) {
                    var c2 = coins[ci2];
                    if (c2.collected) continue;
                    var dx = (player.x + player.w / 2) - c2.x;
                    var dy = (player.y + player.h / 2) - c2.y;
                    if (Math.sqrt(dx * dx + dy * dy) < player.w / 2 + c2.r) {
                        c2.collected = true;
                        score += 30;
                        sfxCoin();
                        spawnParticles(c2.x, c2.y, '#ffd740', 18);
                        coins.splice(ci2, 1);
                    }
                }

                for (var pi = particles.length - 1; pi >= 0; pi--) {
                    var pp = particles[pi];
                    pp.x += pp.vx;
                    pp.y += pp.vy;
                    pp.life -= pp.decay;
                    pp.vy += 0.03;
                    if (pp.life <= 0) particles.splice(pi, 1);
                }

                updateScoreDisplay();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                var groundY = getGroundY();

                var skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
                skyGrad.addColorStop(0, '#04091a');
                skyGrad.addColorStop(0.5, '#0b1430');
                skyGrad.addColorStop(1, '#121e40');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);

                for (var i = 0; i < 60; i++) {
                    var sx = ((i * 173 + 41) % W);
                    var sy = ((i * 251 + 13) % (groundY - 15)) + 8;
                    var sr = ((i * 37) % 3) * 0.35 + 0.5;
                    var twinkle = 0.4 + Math.sin(frameCount * 0.03 + i * 2.1) * 0.4;
                    ctx.globalAlpha = twinkle;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                var buildingsFar = [{ x: 0, w: 60, h: 110 }, { x: 70, w: 40, h: 150 }, { x: 120, w: 65, h: 95 }, { x: 195,
                    w: 45, h: 170 }, { x: 250, w: 70, h: 120 }, { x: 330, w: 35, h: 140 }, { x: 375, w: 55, h: 160 },
                { x: 440, w: 50, h: 105 }, { x: 500, w: 65, h: 180 }];
                ctx.fillStyle = 'rgba(14,20,48,0.9)';
                for (var bf = 0; bf < buildingsFar.length; bf++) {
                    var b = buildingsFar[bf];
                    var bx = (b.x - groundScroll * 0.3) % (W + 120) - 60;
                    ctx.fillRect(bx, groundY - b.h, b.w, b.h);
                }

                var buildingsNear = [{ x: 0, w: 80, h: 190 }, { x: 95, w: 55, h: 240 }, { x: 165, w: 70, h: 170 }, { x: 250,
                    w: 50, h: 260 }, { x: 315, w: 75, h: 200 }, { x: 405, w: 60, h: 230 }];
                ctx.fillStyle = 'rgba(8,12,32,0.95)';
                for (var bn = 0; bn < buildingsNear.length; bn++) {
                    var bn2 = buildingsNear[bn];
                    var bnx = (bn2.x - groundScroll * 0.6) % (W + 140) - 70;
                    ctx.fillRect(bnx, groundY - bn2.h, bn2.w, bn2.h);
                }

                ctx.fillStyle = '#ffd740';
                for (var bnl = 0; bnl < buildingsNear.length; bnl++) {
                    var bnl2 = buildingsNear[bnl];
                    var bnlx = (bnl2.x - groundScroll * 0.6) % (W + 140) - 70;
                    for (var wy = groundY - bnl2.h + 18; wy < groundY - 25; wy += 28) {
                        for (var wx = bnlx + 10; wx < bnlx + bnl2.w - 12; wx += 20) {
                            if (Math.random() < 0.5) {
                                ctx.globalAlpha = 0.45 + Math.random() * 0.55;
                                ctx.fillRect(wx, wy, 8, 10);
                            }
                        }
                    }
                }
                ctx.globalAlpha = 1;

                var groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
                groundGrad.addColorStop(0, '#1a2850');
                groundGrad.addColorStop(1, '#0a1030');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, groundY, W, H - groundY);

                ctx.strokeStyle = 'rgba(0,229,255,0.5)';
                ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(0,229,255,0.7)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(W, groundY);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(0,229,255,0.4)';
                for (var gi = 0; gi < W / 35 + 2; gi++) {
                    var gx = (gi * 35 - groundScroll % 35 + W) % W;
                    if (gx < W) ctx.fillRect(gx, groundY + 4, 14, 3);
                }

                for (var ci = 0; ci < coins.length; ci++) {
                    var c = coins[ci];
                    if (c.collected) continue;
                    var glowR = c.r + 5 + Math.sin(c.pulsePhase) * 3;
                    var glow = ctx.createRadialGradient(c.x, c.y, c.r * 0.3, c.x, c.y, glowR);
                    glow.addColorStop(0, 'rgba(255,215,64,0.95)');
                    glow.addColorStop(0.5, 'rgba(255,180,40,0.4)');
                    glow.addColorStop(1, 'rgba(255,150,20,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, glowR, 0, Math.PI * 2);
                    ctx.fill();
                    var coinGrad = ctx.createRadialGradient(c.x - c.r * 0.2, c.y - c.r * 0.2, c.r * 0.1, c.x, c.y, c.r);
                    coinGrad.addColorStop(0, '#fffde0');
                    coinGrad.addColorStop(0.5, '#ffd740');
                    coinGrad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = coinGrad;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(c.x - c.r * 0.25, c.y - c.r * 0.3, c.r * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (var oi = 0; oi < obstacles.length; oi++) {
                    var ob = obstacles[oi];
                    var grad = ctx.createLinearGradient(ob.x, ob.y, ob.x, ob.y + ob.h);
                    grad.addColorStop(0, '#ff3d60');
                    grad.addColorStop(0.5, '#e02040');
                    grad.addColorStop(1, '#6b0020');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(255,45,120,0.6)';
                    ctx.shadowBlur = 14;
                    if (ob.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(ob.x + ob.w / 2, ob.y);
                        ctx.lineTo(ob.x, ob.y + ob.h);
                        ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
                        ctx.closePath();
                        ctx.fill();
                    } else if (ob.type === 'pillar') {
                        ctx.beginPath();
                        if (ctx.roundRect) { ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 6);
                            ctx.fill(); } else { ctx.fillRect(ob.x, ob.y, ob.w, ob.h); }
                    } else {
                        ctx.beginPath();
                        if (ctx.roundRect) { ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
                            ctx.fill(); } else { ctx.fillRect(ob.x, ob.y, ob.w, ob.h); }
                        ctx.beginPath();
                        var dw = ob.w * 0.7;
                        var dh = ob.h * 0.5;
                        if (ctx.roundRect) { ctx.roundRect(ob.x + ob.w + 4, ob.y + ob.h * 0.3, dw, dh, 3); } else { ctx
                                .fillRect(ob.x + ob.w + 4, ob.y + ob.h * 0.3, dw, dh); }
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,150,180,0.6)';
                    ctx.lineWidth = 1.5;
                    if (ob.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(ob.x + ob.w / 2, ob.y);
                        ctx.lineTo(ob.x, ob.y + ob.h);
                        ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
                        ctx.closePath();
                        ctx.stroke();
                    } else if (ob.type === 'pillar') {
                        ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
                    } else {
                        ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
                    }
                }

                for (var ti = 0; ti < player.trail.length; ti++) {
                    var t = player.trail[ti];
                    var alpha = t.life * 0.55;
                    var r = 7 * t.life;
                    ctx.fillStyle = 'rgba(0,229,255,' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (player.invincible > 0 && player.invincible % 6 < 3) ctx.globalAlpha = 0.4;
                var px = player.x,
                    py = player.y,
                    pw = player.w,
                    ph = player.h;
                var playerGlow = ctx.createRadialGradient(px + pw / 2, py + ph / 2, pw * 0.3, px + pw / 2, py + ph / 2, pw *
                    1.2);
                playerGlow.addColorStop(0, 'rgba(0,229,255,0.8)');
                playerGlow.addColorStop(0.5, 'rgba(0,180,255,0.3)');
                playerGlow.addColorStop(1, 'rgba(0,100,200,0)');
                ctx.fillStyle = playerGlow;
                ctx.fillRect(px - 8, py - 8, pw + 16, ph + 16);
                var bodyGrad = ctx.createLinearGradient(px, py, px, py + ph);
                bodyGrad.addColorStop(0, '#00e5ff');
                bodyGrad.addColorStop(0.4, '#00b8d4');
                bodyGrad.addColorStop(1, '#0050a0');
                ctx.fillStyle = bodyGrad;
                ctx.fillRect(px, py, pw, ph);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillRect(px + pw * 0.2, py + 5, pw * 0.35, ph * 0.22);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(px + pw * 0.55, py + ph * 0.3, pw * 0.2, ph * 0.15);
                ctx.globalAlpha = 1;

                for (var pidx = 0; pidx < particles.length; pidx++) {
                    var pt = particles[pidx];
                    ctx.globalAlpha = pt.life;
                    ctx.fillStyle = pt.color;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                if (gameState === 'waiting') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold ' + Math.floor(W * 0.055) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('点击屏幕开始奔跑', W / 2, H / 2 - 10);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = Math.floor(W * 0.03) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.fillText('点击跳跃 · 支持二段跳', W / 2, H / 2 + 30);
                }
                if (gameState === 'gameover') {
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#ff2d78';
                    ctx.font = 'bold ' + Math.floor(W * 0.065) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏结束', W / 2, H / 2 - 20);
                    ctx.fillStyle = '#fff';
                    ctx.font = Math.floor(W * 0.04) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.fillText('得分: ' + Math.floor(score), W / 2, H / 2 + 25);
                    ctx.fillStyle = '#ffd740';
                    ctx.font = Math.floor(W * 0.035) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.fillText('点击屏幕重新开始', W / 2, H / 2 + 55);
                }
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ==================== 输入处理 ====================
            canvas.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                jump();
            });
            canvas.addEventListener('pointerup', function(e) {
                e.preventDefault();
            });
            window.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    e.preventDefault();
                    jump();
                }
                if (e.code === 'KeyF') { e.preventDefault();
                    toggleFullscreen(); }
                if (e.code === 'KeyM') { e.preventDefault();
                    btnSound.click(); }
            });

            // ==================== 全屏 ====================
            function isFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement);
            }

            function requestFullscreen() {
                var el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(function() {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                }
            }

            function exitFullscreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(function() {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }

            function toggleFullscreen() {
                initAudio();
                if (isFullscreen()) exitFullscreen();
                else requestFullscreen();
            }

            function updateFullscreenIconUI() {
                var full = isFullscreen();
                if (full) {
                    fullscreenIcon.innerHTML =
                        '<polyline points="4 8 8 4 4 4 4 8"></polyline><polyline points="20 8 16 4 20 4 20 8"></polyline><polyline points="20 16 16 20 20 20 20 16"></polyline><polyline points="4 16 8 20 4 20 4 16"></polyline>';
                } else {
                    fullscreenIcon.innerHTML =
                        '<polyline points="8 3 3 3 3 8"></polyline><polyline points="16 3 21 3 21 8"></polyline><polyline points="21 16 21 21 16 21"></polyline><polyline points="3 16 3 21 8 21"></polyline>';
                }
            }

            btnFullscreen.addEventListener('pointerdown', function(e) {
                e.stopPropagation();
                e.preventDefault();
                toggleFullscreen();
            });
            document.addEventListener('fullscreenchange', function() {
                updateFullscreenIconUI();
                setTimeout(resizeCanvas, 300);
            });
            document.addEventListener('webkitfullscreenchange', function() {
                updateFullscreenIconUI();
                setTimeout(resizeCanvas, 300);
            });
            updateFullscreenIconUI();

            // 音效按钮
            btnSound.addEventListener('pointerdown', function(e) {
                e.stopPropagation();
                e.preventDefault();
                initAudio();
                soundEnabled = !soundEnabled;
                updateSoundIcon();
                if (soundEnabled && audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(function() {});
                }
            });

            // ==================== 初始化 ====================
            function init() {
                resizeCanvas();
                try {
                    var saved = localStorage.getItem('neonRunnerHS');
                    if (saved) highScore = parseInt(saved) || 0;
                } catch (e) { highScore = 0; }
                resetGame();
                updateScoreDisplay();
                updateSoundIcon();
                updateFullscreenIconUI();
            }
            init();
            gameLoop();
        })();
    </script>
</body>
</html>
