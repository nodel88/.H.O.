<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>分形漫游 · 灵触净界 · 全屏整合</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050010; touch-action: none; }
        #game-world { position: relative; width: 100%; height: 100%; background: #050010; cursor: default; }
        .fractal-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #background-canvas { z-index: 1; filter: blur(36px); }
        #mid-canvas { z-index: 2; mix-blend-mode: color-dodge; opacity: 0.5; }
        #game-canvas { z-index: 3; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .ui-overlay > * { pointer-events: auto; }
        .game-title-header { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 700; color: #cccccc; letter-spacing: 6px; white-space: nowrap; z-index: 500; text-shadow: 0 0 8px rgba(255,255,255,0.2); pointer-events: none; }
        
        /* 底部导航条：强制一行，自适应缩放 */
        .ui-bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            backdrop-filter: none;
            border: none;
            padding: 6px 10px;
            z-index: 100;
            pointer-events: auto;
            max-width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .ui-bottom-bar::-webkit-scrollbar { display: none; }
        .bottom-control {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.9;
            flex-shrink: 0;
        }
        .bottom-control:hover { opacity: 1; transform: scale(1.05); background: rgba(0,0,0,0.85); }
        .bottom-control svg { width: 22px; height: 22px; stroke: #cccccc; stroke-width: 1.8; fill: none; }
        
        .progress-wrapper {
            display: inline-flex;
            align-items: center;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 4px 14px;
            gap: 8px;
            flex-shrink: 0;
        }
        .level-stats { font-family: 'Orbitron', monospace; font-size: 18px; color: #dddddd; font-weight: 600; }
        .progress-dots { display: flex; gap: 4px; }
        .progress-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); }
        .progress-dot.filled { background: #dddddd; box-shadow: 0 0 6px #cccccc; border-color: #ffffff; }
        
        /* 小屏幕整体缩小导航元素 */
        @media (max-width: 650px) {
            .ui-bottom-bar { gap: 5px; padding: 4px 8px; }
            .bottom-control { width: 38px; height: 38px; }
            .bottom-control svg { width: 18px; height: 18px; }
            .progress-wrapper { padding: 3px 10px; }
            .level-stats { font-size: 16px; }
            .game-title-header { font-size: 20px; top: 16px; letter-spacing: 4px; }
        }
        @media (max-width: 550px) {
            .ui-bottom-bar { gap: 4px; }
            .bottom-control { width: 34px; height: 34px; }
            .bottom-control svg { width: 16px; height: 16px; }
            .progress-wrapper { padding: 2px 8px; }
            .level-stats { font-size: 14px; }
        }
        @media (max-width: 480px) {
            .bottom-control { width: 32px; height: 32px; }
        }
        
        /* 模态框样式 (不变) */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            display: flex;
            opacity: 0;
            visibility: hidden;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-card {
            background: rgba(10, 5, 20, 0.96);
            border: 1px solid rgba(204,204,204,0.25);
            border-radius: 32px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: translateY(24px);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .modal-overlay.visible .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal-header h2 { font-family: 'Orbitron', sans-serif; font-size: 28px; color: #cccccc; letter-spacing: 2px; }
        .close-btn { font-size: 40px; line-height: 1; cursor: pointer; color: #aaa; transition: 0.2s; }
        .close-btn:hover { color: #fff; }
        .modal-body { flex: 1; overflow-y: auto; padding: 24px 28px; color: #eee; }
        .modal-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .modal-tab { font-family: 'Orbitron', sans-serif; font-size: 20px; padding: 6px 16px; cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .modal-tab.active { opacity: 1; border-bottom: 2px solid #cccccc; }
        .tab-content { display: none; animation: fade 0.2s; }
        .tab-content.active { display: block; }
        @keyframes fade { from { opacity:0; } to { opacity:1; } }
        
        .treasury-grid { display: grid; gap: 24px; margin-top: 16px; }
        .treasury-grid.cols-2 { grid-template-columns: repeat(2,1fr); }
        .treasury-grid.cols-5 { grid-template-columns: repeat(5,1fr); }
        .treasury-grid.cols-10 { grid-template-columns: repeat(10,1fr); }
        .fractal-item { aspect-ratio: 1; background: #0a0a12; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); padding: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .fractal-item canvas { width: 100%; height: 100%; object-fit: contain; }
        .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 20px; margin-top: 10px; }
        .level-card { background: rgba(255,255,255,0.05); border-radius: 24px; text-align: center; padding: 16px 8px; cursor: pointer; transition: 0.2s; }
        .level-card.locked { opacity: 0.4; filter: grayscale(0.4); cursor: not-allowed; }
        .level-card.current { border: 2px solid #cccccc; background: rgba(204,204,204,0.1); }
        .level-num { font-family: 'Orbitron'; font-size: 32px; color: #fff; }
        .fullscreen-zoom { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 300; display: none; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }
        .fullscreen-zoom.visible { display: flex; }
        .fullscreen-canvas { max-width: 85vw; max-height: 85vh; background: #000; border-radius: 28px; box-shadow: 0 0 60px rgba(255,255,255,0.1); }
        .continue-modal { background: transparent; text-align: center; }
        .continue-level { font-family: 'Orbitron'; font-size: 140px; color: white; text-shadow: 0 0 30px rgba(255,255,255,0.4); }
        .audio-slider-group { margin-bottom: 28px; }
        input[type="range"] { width: 100%; height: 6px; -webkit-appearance: none; background: #333; border-radius: 3px; }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #cccccc; border-radius: 50%; cursor: pointer; }
        .view-mode-btn { background: rgba(255,255,255,0.1); border: none; padding: 8px 16px; border-radius: 30px; color: #ccc; font-family: monospace; cursor: pointer; margin-right: 10px; }
        .view-mode-btn.active { background: #cccccc22; border: 1px solid #ccc; color: white; }
        .settings-group { margin-bottom: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; }
        .settings-group label { display: flex; justify-content: space-between; font-family: 'Orbitron', sans-serif; font-size: 18px; margin-bottom: 8px; }
        .color-input-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .color-input-group input { width: 50px; height: 40px; border: 1px solid #ccc; background: #222; border-radius: 8px; cursor: pointer; }
        @media (max-width: 600px) { .level-num { font-size: 26px; } .level-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px; } }
    </style>
</head>
<body>
<div id="game-world">
    <canvas id="background-canvas" class="fractal-layer"></canvas>
    <canvas id="mid-canvas" class="fractal-layer"></canvas>
    <canvas id="game-canvas" class="fractal-layer"></canvas>
    <div class="ui-overlay">
        <div class="game-title-header">✨ HARDIOPERA · 灵触净界 ✨</div>
        <div class="ui-bottom-bar">
            <div class="bottom-control" id="theme-trigger"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
            <div class="bottom-control" id="level-library-trigger"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
            <div class="bottom-control" id="treasury-trigger"><svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
            <div class="progress-wrapper"><div class="level-stats" id="level-stats">1</div><div class="progress-dots" id="progress-dots-container"></div></div>
            <div class="bottom-control" id="mute-toggle"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></div>
            <!-- 全屏按钮替换原排行榜 -->
            <div class="bottom-control" id="fullscreen-toggle"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></div>
            <div class="bottom-control" id="version-trigger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>
        </div>
        <!-- 模态框：version-modal 整合了 Intro + Evolution Log + Leaderboard -->
        <div id="version-modal" class="modal-overlay"><div class="modal-card"><div class="modal-header"><h2>漫游手记</h2><div class="close-btn version-close">&times;</div></div><div class="modal-body"><div class="modal-tabs"><div class="modal-tab active" data-tab="intro">✨ 灵境</div><div class="modal-tab" data-tab="log">📜 演进诗篇</div><div class="modal-tab" data-tab="leaderboard">🏆 星穹榜</div></div><div id="intro-tab" class="tab-content active"><div id="intro-text"></div></div><div id="log-tab" class="tab-content"><div id="log-list"></div></div><div id="leaderboard-tab" class="tab-content"><div id="leaderboard-list-inline"></div></div></div></div></div>
        <!-- 其他模态框 -->
        <div id="treasury-modal" class="modal-overlay"><div class="modal-card"><div class="modal-header"><h2>📦 分形宝库</h2><div><button class="view-mode-btn" data-cols="2">2列</button><button class="view-mode-btn" data-cols="5">5列</button><button class="view-mode-btn" data-cols="10">10列</button></div><div class="close-btn treasury-close">&times;</div></div><div class="modal-body"><div id="treasury-grid"></div></div></div></div>
        <div id="level-lib-modal" class="modal-overlay"><div class="modal-card"><div class="modal-header"><h2>🌀 维度之门</h2><div class="close-btn level-lib-close">&times;</div></div><div class="modal-body"><div id="level-grid" class="level-grid"></div></div></div></div>
        <div id="audio-modal" class="modal-overlay"><div class="modal-card"><div class="modal-header"><h2>🎵 韵律共鸣</h2><div class="close-btn audio-close">&times;</div></div><div class="modal-body"><div class="audio-slider-group"><label>🎼 灵境弦音 <span id="music-val">50%</span></label><input type="range" id="music-slider" min="0" max="100" value="50"><div><button id="music-mute-btn" style="background:none;border:1px solid #ccc;padding:6px 16px;border-radius:30px;color:#ccc;">静音/恢复</button></div></div><div class="audio-slider-group"><label>💎 碎晶回响 <span id="sfx-val">50%</span></label><input type="range" id="sfx-slider" min="0" max="100" value="50"><div><button id="sfx-mute-btn" style="background:none;border:1px solid #ccc;padding:6px 16px;border-radius:30px;color:#ccc;">静音/恢复</button></div></div></div></div></div>
        <div id="theme-modal" class="modal-overlay"><div class="modal-card"><div class="modal-header"><h2>🎨 色调 & 光晕</h2><div class="close-btn theme-close">&times;</div></div><div class="modal-body"><div id="theme-options" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;"></div><div class="settings-group"><label>🌕 背景亮度 <span id="brightness-val">130%</span></label><input type="range" id="brightness-slider" min="20" max="200" value="130" step="5"></div><div class="settings-group"><label>✨ 光晕半径 <span id="glow-size-val">420</span>px</label><input type="range" id="glow-size-slider" min="150" max="700" value="420" step="10"></div><div class="settings-group"><label>🎨 光晕色彩数量 <span id="glow-count-val">4</span></label><input type="range" id="glow-count-slider" min="1" max="6" value="4" step="1"></div><div class="settings-group"><label>🌈 光晕主色</label><div class="color-input-group"><input type="color" id="glow-color1" value="#00ffff"><span style="flex:1">副色1</span><input type="color" id="glow-color2" value="#ff00ff"><span>副色2</span><input type="color" id="glow-color3" value="#ffaa00"></div></div></div></div></div>
        <div id="continue-modal" class="modal-overlay"><div class="modal-card continue-modal" style="background:transparent;border:none;"><div style="background:rgba(0,0,0,0.7);backdrop-filter:blur(16px);border-radius:48px;padding:32px;"><div class="continue-level" id="saved-level-num">1</div><p style="font-size:20px;margin:20px 0;">✨ 意识共鸣 · 以太余韵 ✨</p><div style="display:flex;gap:16px;justify-content:center;"><button id="continue-confirm" style="background:#cccccc22;border:1px solid #ccc;padding:12px 28px;border-radius:60px;color:white;">继续游曳</button><button id="restart-confirm" style="background:#ff006622;border:1px solid #ff66aa;padding:12px 28px;border-radius:60px;color:#ffbbdd;">破碎新生</button></div></div></div></div>
        <div id="fullscreen-zoom" class="fullscreen-zoom"><canvas id="fullscreen-canvas" class="fullscreen-canvas"></canvas></div>
    </div>
</div>
<script>
    // 手机端检测与适配参数
    const isMobile = window.innerWidth < 768 || ('ontouchstart' in window);
    const WORLD_SIZE = isMobile ? 2000 : 3400;
    const FRAGMENT_DRAW_SIZE = isMobile ? 48 : 78;
    const FRAGMENT_COLLIDE_RADIUS = 48;
    const MOBILE_ZOOM_FACTOR = isMobile ? 0.7 : 1.0;
    
    const ASSET_MAP = {};
    ASSET_MAP["player_character"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/images/player_character_e0ed7bee-b8b5-4bc1-a385-02924bddd83a.webp",type:"image"};
    ASSET_MAP["art_fragment_1"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/images/art_fragment_1_f9a564da-5956-4d18-ad75-448e59d994dc.webp",type:"image"};
    ASSET_MAP["art_fragment_2"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/images/art_fragment_2_2059b668-fbb6-4a8c-a196-1eeb1404c64f.webp",type:"image"};
    ASSET_MAP["art_fragment_3"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/images/art_fragment_3_88986540-cff9-4ef0-b377-c870b87ee039.webp",type:"image"};
    ASSET_MAP["ambient_music"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/ambient_music_500cdb0d-1401-462a-8d96-699521785027.mp3",type:"audio"};
    ASSET_MAP["bg_music_lv2"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/bg_music_lv2_bd37ca63-612c-4d54-960f-6a107f522811.mp3",type:"audio"};
    ASSET_MAP["bg_music_lv3"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/bg_music_lv3_b4b3bc6a-1608-4365-bbba-71c34a3aac9d.mp3",type:"audio"};
    ASSET_MAP["bg_music_lv4"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/bg_music_lv4_8d804857-6d34-4a89-8ce4-38d462f79bd3.mp3",type:"audio"};
    ASSET_MAP["bg_music_lv5"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/bg_music_lv5_2f5edc3d-0987-4e05-a3b0-2fd942d0d7d9.mp3",type:"audio"};
    ASSET_MAP["wind_chime_1"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/wind_chime_1_a7ad9658-db3e-4b08-b78b-6a93e560ed52.mp3",type:"audio"};
    ASSET_MAP["completion_sfx"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/completion_sfx_0b89ff30-4250-47ab-8f6b-e11e0b40a411.mp3",type:"audio"};
    ASSET_MAP["ui_click_sfx"]={url:"https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/ui_click_sfx_178bed51-274c-4b9b-8a60-2860540f5898.mp3",type:"audio"};
    
    window.lib = {
        getAsset: (id) => ASSET_MAP[id],
        log: (msg) => console.log(msg),
        showGameParameters: () => {},
        shouldUseTouchControls: () => 'ontouchstart' in window,
        addPlayerScoreToLeaderboard: async (score) => { let lb = JSON.parse(localStorage.getItem("fractal_lb")||"[]"); lb.push({username:"灵迹旅者",score:score,date:Date.now()}); lb.sort((a,b)=>b.score-a.score); localStorage.setItem("fractal_lb",JSON.stringify(lb.slice(0,10))); return {success:true}; },
        getTopNEntriesFromLeaderboard: async (n=10) => { let lb=JSON.parse(localStorage.getItem("fractal_lb")||"[]"); return {entries:lb.slice(0,n)}; },
        saveUserGameState: async (state) => { localStorage.setItem("game_save",JSON.stringify(state)); return {success:true,state}; },
        getUserGameState: async () => { let raw=localStorage.getItem("game_save"); return {state: raw ? JSON.parse(raw) : null}; },
        deleteUserGameState: async () => { localStorage.removeItem("game_save"); return {success:true}; }
    };
    window.gameConfig = {
        colorPalette: "cosmic_purple", animationSpeed: 1, worldSize: "medium", numFragments: 6,
        playerSpeed: 1, musicVolume: 55, sfxVolume: 55, currentLevel: 1, collectedFractals: {},
        fragments: [], musicMuted: false, sfxMuted: false, evolutionLog: [], language: "zh",
        brightness: 1.3, glowSize: 420, glowColor1: "#00ffff", glowColor2: "#ff00ff", glowColor3: "#ffaa00", glowColorCount: 4
    };
    window.gameConfig.evolutionLog = [{version:"v23.0",desc:"✨ 全屏整合 ✨ 排行榜并入漫游手记，原图标改为全屏切换，导航条强制一行"},{version:"v22.0",desc:"初始亮度/光晕大幅提升"}];
    
    let audioCtx = null, musicSource = null, musicGain = null, sfxBuffers = {};
    function initAudio() { if(audioCtx) return; audioCtx = new (window.AudioContext||window.webkitAudioContext)(); musicGain = audioCtx.createGain(); musicGain.connect(audioCtx.destination); musicGain.gain.value = (window.gameConfig.musicVolume/100)*(window.gameConfig.musicMuted?0:1); }
    async function preloadAudio() { if(!audioCtx) initAudio(); for(let id of Object.keys(ASSET_MAP)) { if(ASSET_MAP[id].type==='audio'){ try{ let resp=await fetch(ASSET_MAP[id].url); let buf=await resp.arrayBuffer(); let decoded=await audioCtx.decodeAudioData(buf); sfxBuffers[id]=decoded; }catch(e){} } } }
    function playSFX(id, detune=0) { if(window.gameConfig.sfxMuted) return; let buf=sfxBuffers[id]; if(!buf||!audioCtx) return; let src=audioCtx.createBufferSource(); src.buffer=buf; let gain=audioCtx.createGain(); gain.gain.value=window.gameConfig.sfxVolume/100; src.connect(gain); gain.connect(audioCtx.destination); if(src.detune) src.detune.value=detune; src.start(); }
    function playMusicByLevel() { if(musicSource) try{musicSource.stop();}catch(e){} let level=window.gameConfig.currentLevel||1; let musicId = level===1?"ambient_music":`bg_music_lv${Math.min(level,5)}`; let buf=sfxBuffers[musicId]; if(!buf) buf=sfxBuffers["ambient_music"]; if(!buf||!audioCtx) return; musicSource=audioCtx.createBufferSource(); musicSource.buffer=buf; musicSource.loop=true; musicSource.connect(musicGain); musicSource.start(); }
    function stopMusic() { if(musicSource){ try{ musicSource.stop(); }catch(e){} musicSource=null; } }
    document.body.addEventListener('click',()=>{ if(audioCtx && audioCtx.state==='suspended') { audioCtx.resume(); playMusicByLevel(); } },{once:true});
    
    // 分形绘制函数 (保持不变)
    function drawFractalPattern(ctx, params, x, y, sizeScale, globalAlpha=1.0) {
        if (!params) return;
        const { sides, depth, spread, lengthBase, growthFactor, lineWidth, color, rotation } = params;
        ctx.save(); ctx.translate(x, y); ctx.rotate(rotation || 0);
        ctx.strokeStyle = color || "#cccccc"; ctx.lineWidth = (lineWidth || 2) * sizeScale; ctx.globalAlpha = globalAlpha; ctx.lineCap = 'round';

        function drawBranch(cx, cy, angle, currentLen, remainingDepth) {
            if (remainingDepth <= 0) return;
            const newX = cx + Math.cos(angle) * currentLen, newY = cy + Math.sin(angle) * currentLen;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(newX, newY); ctx.stroke();
            const nextLen = currentLen * (growthFactor || 0.68);
            drawBranch(newX, newY, angle - spread, nextLen, remainingDepth-1);
            drawBranch(newX, newY, angle + spread, nextLen, remainingDepth-1);
        }
        for (let i = 0; i < sides; i++) drawBranch(0, 0, (Math.PI*2/sides)*i, totalLen, depth);
        ctx.restore();
    }
    function generateRandomFractalParams(baseColor) {
        const isComplex = Math.random() > 0.5;
        let sides = isComplex ? 6+Math.floor(Math.random()*5) : 3+Math.floor(Math.random()*2);
        let depth = isComplex ? 5+Math.floor(Math.random()*3) : 2+Math.floor(Math.random()*2);
        let spread = isComplex ? 0.7+Math.random()*1.0 : 0.6+Math.random()*0.5;
        let lengthBase = isComplex ? 45+Math.random()*55 : 35+Math.random()*30;
        let growthFactor = isComplex ? 0.55+Math.random()*0.2 : 0.7+Math.random()*0.15;
        let lineWidth = isComplex ? 1.5+Math.random()*2.0 : 2.0+Math.random()*1.5;
        return { sides, depth, spread, lengthBase, growthFactor, lineWidth, color: baseColor, rotation: Math.random()*Math.PI*2 };
    }

            };
        });
        
        document.getElementById('intro-text').innerHTML = "<h3>✨ 光晕与亮度全面自定义 ✨</h3><p>全屏切换已就位，排行榜整合在手记中，底部导航条强制一行自适应。</p>";
        const logDiv = document.getElementById('log-list'); 
        logDiv.innerHTML = window.gameConfig.evolutionLog.map(l => `<div style="margin-bottom:20px;"><b>${l.version}</b><br/>${l.desc}</div>`).join('');
        
        // 亮度、光晕控件（同前）
        const brightnessSlider = document.getElementById('brightness-slider');
        const brightnessVal = document.getElementById('brightness-val');
        brightnessSlider.value = (window.gameConfig.brightness || 1.3) * 100;
        brightnessVal.innerText = Math.round(brightnessSlider.value) + '%';
        brightnessSlider.oninput = () => { let v = parseInt(brightnessSlider.value); brightnessVal.innerText = v+'%'; window.gameConfig.brightness = v/100; lib.saveUserGameState(window.gameConfig); };
        const glowSizeSlider = document.getElementById('glow-size-slider');
        const glowSizeVal = document.getElementById('glow-size-val');
        glowSizeSlider.value = window.gameConfig.glowSize || 420;
        glowSizeVal.innerText = glowSizeSlider.value;
        glowSizeSlider.oninput = () => { let v = parseInt(glowSizeSlider.value); glowSizeVal.innerText = v; window.gameConfig.glowSize = v; lib.saveUserGameState(window.gameConfig); };
        const glowCountSlider = document.getElementById('glow-count-slider');
        const glowCountVal = document.getElementById('glow-count-val');
        glowCountSlider.value = window.gameConfig.glowColorCount || 4;
        glowCountVal.innerText = glowCountSlider.value;
        glowCountSlider.oninput = () => { let v = parseInt(glowCountSlider.value); glowCountVal.innerText = v; window.gameConfig.glowColorCount = v; lib.saveUserGameState(window.gameConfig); };
        const color1 = document.getElementById('glow-color1');
        const color2 = document.getElementById('glow-color2');
        const color3 = document.getElementById('glow-color3');
        color1.value = window.gameConfig.glowColor1 || "#00ffff";
        color2.value = window.gameConfig.glowColor2 || "#ff00ff";
        color3.value = window.gameConfig.glowColor3 || "#ffaa00";
        color1.oninput = () => { window.gameConfig.glowColor1 = color1.value; lib.saveUserGameState(window.gameConfig); };
        color2.oninput = () => { window.gameConfig.glowColor2 = color2.value; lib.saveUserGameState(window.gameConfig); };
        color3.oninput = () => { window.gameConfig.glowColor3 = color3.value; lib.saveUserGameState(window.gameConfig); };
        
        const themeGrid = document.getElementById('theme-options');
        Object.keys(colorPalettes).forEach(key => { 
            let btn = document.createElement('button'); 
            btn.innerText = key==='cosmic_purple'?'宇宙紫':(key==='void_blue'?'虚空蓝':(key==='nebula_red'?'星云红':'明亮模式')); 
            btn.style.cssText = 'background:rgba(255,255,255,0.1);border:1px solid #ccc;border-radius:40px;padding:12px;color:white;cursor:pointer;'; 
            btn.onclick = () => { window.gameConfig.colorPalette = key; document.getElementById('theme-modal').classList.remove('visible'); playSFX('ui_click_sfx'); }; 
            themeGrid.appendChild(btn); 
        });
        
        // 宝库、关卡库等（简略但功能完整）
        let currentTreasuryCols = 5;
        document.querySelectorAll('#treasury-modal .view-mode-btn').forEach(btn => { btn.onclick = () => { currentTreasuryCols = parseInt(btn.dataset.cols); document.querySelectorAll('#treasury-modal .view-mode-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderTreasury(); playSFX('ui_click_sfx'); }; });
        const fullscreenZoom = document.getElementById('fullscreen-zoom');
        const fullCanvas = document.getElementById('fullscreen-canvas');
        fullscreenZoom.onclick = () => { fullscreenZoom.classList.remove('visible'); playSFX('ui_click_sfx'); };
        function renderTreasury() {
            const container = document.getElementById('treasury-grid');
            container.innerHTML = '';
            let collected = window.gameConfig.collectedFractals || {};
            let levels = Object.keys(collected).sort((a,b)=>parseInt(a)-parseInt(b));
            for(let lvl of levels) {
                let section = document.createElement('div');
                section.innerHTML = `<h3 style="margin:20px 0 12px; color:#ccc">🌀 维度 ${lvl}</h3><div class="treasury-grid cols-${currentTreasuryCols}" id="grid-${lvl}"></div>`;
                container.appendChild(section);
                let grid = section.querySelector(`.treasury-grid`);
                collected[lvl].forEach((params, idx) => {
                    let item = document.createElement('div'); item.className = 'fractal-item';
                    let cv = document.createElement('canvas'); cv.width = 300; cv.height = 300;
                    let ctxTemp = cv.getContext('2d');
                    ctxTemp.fillStyle = '#0a0a12'; ctxTemp.fillRect(0,0,300,300);
                    drawFractalPattern(ctxTemp, params, 150, 150, 1.4, 1.0);
                    item.appendChild(cv);
                    item.onclick = (e) => { e.stopPropagation(); fullCanvas.width = 1000; fullCanvas.height = 1000; let fCtx = fullCanvas.getContext('2d'); fCtx.fillStyle = '#000'; fCtx.fillRect(0,0,1000,1000); drawFractalPattern(fCtx, params, 500, 500, 4.2, 1.0); fullscreenZoom.classList.add('visible'); playSFX('ui_click_sfx'); };
                    grid.appendChild(item);
                });
            }
            if(levels.length===0) container.innerHTML = '<p style="color:gray; text-align:center">✨ 尚未收集任何分形印记 ✨</p>';
        }
        document.getElementById('treasury-trigger').onclick = () => { renderTreasury(); document.getElementById('treasury-modal').classList.add('visible'); playSFX('ui_click_sfx'); };
        async function renderLevelLibrary() { const state = await lib.getUserGameState(); const highest = state.state?.currentLevel || 1; const cur = window.gameConfig.currentLevel; const container = document.getElementById('level-grid'); container.innerHTML = ''; const maxLevel = Math.max(12, highest + 3); for(let i=1;i<=maxLevel;i++) { let card = document.createElement('div'); card.className = `level-card ${i>highest?'locked':''} ${i===cur?'current':''}`; card.innerHTML = `<div class="level-num">${i}</div>`; if(i <= highest) card.onclick = () => { window.gameConfig.currentLevel = i; initLevel(); document.getElementById('level-lib-modal').classList.remove('visible'); playSFX('ui_click_sfx'); }; container.appendChild(card); } }
        document.getElementById('level-library-trigger').onclick = () => { renderLevelLibrary(); document.getElementById('level-lib-modal').classList.add('visible'); playSFX('ui_click_sfx'); };
        
        let musicSlider = document.getElementById('music-slider'), sfxSlider = document.getElementById('sfx-slider');
        musicSlider.oninput = () => { let v=musicSlider.value; document.getElementById('music-val').innerText=v+'%'; window.gameConfig.musicVolume=parseInt(v); if(musicGain) musicGain.gain.value=(v/100)*(window.gameConfig.musicMuted?0:1); };
        sfxSlider.oninput = () => { let v=sfxSlider.value; document.getElementById('sfx-val').innerText=v+'%'; window.gameConfig.sfxVolume=parseInt(v); };
        document.getElementById('music-mute-btn').onclick = () => { window.gameConfig.musicMuted = !window.gameConfig.musicMuted; if(musicGain) musicGain.gain.value=(window.gameConfig.musicVolume/100)*(window.gameConfig.musicMuted?0:1); playSFX('ui_click_sfx'); };
        document.getElementById('sfx-mute-btn').onclick = () => { window.gameConfig.sfxMuted = !window.gameConfig.sfxMuted; playSFX('ui_click_sfx'); };
        musicSlider.value = window.gameConfig.musicVolume; document.getElementById('music-val').innerText = window.gameConfig.musicVolume+'%';
        sfxSlider.value = window.gameConfig.sfxVolume; document.getElementById('sfx-val').innerText = window.gameConfig.sfxVolume+'%';
        
        let savedState = await lib.getUserGameState(); if(savedState.state && savedState.state.currentLevel > 1) { let cont = document.getElementById('continue-modal'); document.getElementById('saved-level-num').innerText = savedState.state.currentLevel; cont.classList.add('visible'); document.getElementById('continue-confirm').onclick = () => { window.gameConfig.currentLevel = savedState.state.currentLevel; initLevel(); cont.classList.remove('visible'); playSFX('ui_click_sfx'); }; document.getElementById('restart-confirm').onclick = async () => { await lib.deleteUserGameState(); window.gameConfig.currentLevel = 1; initLevel(); cont.classList.remove('visible'); playSFX('ui_click_sfx'); }; }
        window.addEventListener('resize', () => { let w=window.innerWidth,h=window.innerHeight; canvas.width=bgCanvas.width=midCanvas.width=w; canvas.height=bgCanvas.height=midCanvas.height=h; cursorPos = { x: w/2, y: h/2 }; });
        window.dispatchEvent(new Event('resize'));
        if(audioCtx && audioCtx.state==='suspended') audioCtx.resume().then(()=>playMusicByLevel());
        else playMusicByLevel();
    }
    run('play');
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) { if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2; this.moveTo(x+r, y); this.lineTo(x+w-r, y); this.quadraticCurveTo(x+w, y, x+w, y+r); this.lineTo(x+w, y+h-r); this.quadraticCurveTo(x+w, y+h, x+w-r, y+h); this.lineTo(x+r, y+h); this.quadraticCurveTo(x, y+h, x, y+h-r); this.lineTo(x, y+r); this.quadraticCurveTo(x, y, x+r, y); return this; };
    }
</script>
</body>
</html>
